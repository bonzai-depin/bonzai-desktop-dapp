name: "Release (Linux)"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 2.1.2)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-linux-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  publish_on_linux:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # GPU backend matrix: each target produces a distinct .deb. Users
      # download the variant matching their hardware. fail-fast off so a
      # broken ROCm wheel upstream doesn't cancel the working CUDA build.
      fail-fast: false
      matrix:
        gpu_backend: [cuda, rocm]
        include:
          - gpu_backend: cuda
            torch_index_url: https://download.pytorch.org/whl/cu124
            backend_label: CUDA 12.4
          - gpu_backend: rocm
            torch_index_url: https://download.pytorch.org/whl/rocm6.1
            backend_label: ROCm 6.1
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: linux
      ARCH_KEY: x64
      GPU_BACKEND: ${{ matrix.gpu_backend }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CI: true
    steps:
      # Free ~30GB by removing pre-installed tools we don't need.
      # CUDA PyTorch + PyInstaller + Electron need significant disk space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          RAW="${{ env.RELEASE_TAG }}"
          echo "TAG=${RAW#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GPU-enabled PyTorch wheel selection per matrix backend. CUDA cu124
      # for NVIDIA, ROCm 6.1 for AMD. Both fall back to CPU at runtime if
      # the corresponding driver/toolkit isn't present.
      - name: Install PyTorch (${{ matrix.backend_label }})
        run: |
          pip install --no-cache-dir --upgrade \
            torch torchvision torchaudio \
            --index-url ${{ matrix.torch_index_url }}

      - name: Install Python deps
        run: |
          pip install "huggingface_hub>=0.34.0,<1.0"
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install -U qwen-tts --no-deps
          pip install git+https://github.com/ace-step/ACE-Step-1.5.git --no-deps

      # basicsr 1.4.2 (used by /video/enhance via realesrgan) imports
      # `torchvision.transforms.functional_tensor` which was removed in
      # torchvision >= 0.17. Patch the one offending import so the
      # bundled binary doesn't crash on first /video/enhance request.
      - name: Patch basicsr torchvision import
        shell: bash
        run: |
          python -c "
          import site, pathlib, sys
          for sp in site.getsitepackages() + [site.getusersitepackages()]:
              p = pathlib.Path(sp) / 'basicsr' / 'data' / 'degradations.py'
              if p.exists():
                  s = p.read_text()
                  new = s.replace(
                      'from torchvision.transforms.functional_tensor',
                      'from torchvision.transforms.functional',
                  )
                  if new != s:
                      p.write_text(new)
                      print(f'Patched: {p}')
                      sys.exit(0)
                  print(f'Already patched or unchanged: {p}')
                  sys.exit(0)
          print('basicsr/data/degradations.py not found; skipping')
          "

      # Privacy-pipeline smoke tests — codec + provider blueprint. These run
      # against the just-installed deps (torch + lz4 + flask), independently
      # of model weights, so they catch wire-format / framing / runner-
      # registry regressions before we waste a 30-min PyInstaller build on
      # a broken Python tree. Cheap to run; expensive to skip.
      - name: Privacy-pipeline smoke tests
        run: |
          python src/server/pipeline_transport.py
          python scripts/smoke-shard-provider.py
          # Two-host scaffold: JS bridge + Python provider in parallel.
          # Catches CTRL_BEGIN / wire-format mismatches the single-
          # process smokes miss.
          node scripts/smoke-shard-twohost.mjs

      # Strip CUDA libs BEFORE PyInstaller bundles them — keeps onefile under 4GB
      - name: Strip CUDA from torch installation
        if: matrix.gpu_backend == 'cuda'
        run: |
          TORCH_DIR=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")
          echo "Torch dir: $TORCH_DIR"
          echo "Size before: $(du -sh "$TORCH_DIR" | cut -f1)"

          # Remove training-only and unused CUDA libs from the installed torch package
          find "$TORCH_DIR" -name "libnvJitLink*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnvrtc*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcupti*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnvToolsExt*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcurand*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_*_train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_adv*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_heur*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_cnn_train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnccl*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcusparse*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcufft*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcusolver*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libtorch_python*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libc10d*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "caffe2" -exec rm -rf {} + 2>/dev/null || true
          # Remove cuBLAS (huge, only needed for large GEMM — inference uses cuBLASLt instead)
          find "$TORCH_DIR" -name "libcublas.so*" -delete 2>/dev/null || true
          # Remove nvptx compiler libs (JIT compilation, not needed at runtime)
          find "$TORCH_DIR" -name "libnvptxcompiler*" -delete 2>/dev/null || true
          # NEW: additional torch CUDA bloat — safe to strip for inference
          find "$TORCH_DIR" -name "libtorch_cuda_linalg*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnvrtc-builtins*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcusparseLt*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_ops_train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libtorch_cuda_cpp*" -delete 2>/dev/null || true
          # Remove Triton (JIT kernel compiler, not needed for inference)
          find "$(python -c 'import site; print(site.getsitepackages()[0])')" -type d -name "triton" -exec rm -rf {} + 2>/dev/null || true
          # Remove test/benchmark files from torch
          find "$TORCH_DIR" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "benchmarks" -exec rm -rf {} + 2>/dev/null || true
          # NEW: strip torchvision + diffusers + transformers test/doc assets.
          # Adds ~200MB of removals on top of the torch-specific strips above.
          SITE=$(python -c 'import site; print(site.getsitepackages()[0])')
          for PKG in torchvision diffusers transformers datasets peft; do
            if [ -d "$SITE/$PKG" ]; then
              find "$SITE/$PKG" -type d \( -name tests -o -name test -o -name docs -o -name "docs_src" -o -name examples -o -name benchmarks -o -name __pycache__ \) -exec rm -rf {} + 2>/dev/null || true
              find "$SITE/$PKG" -name "*.md" -delete 2>/dev/null || true
              find "$SITE/$PKG" -name "*.rst" -delete 2>/dev/null || true
              find "$SITE/$PKG" -name "*.pyi" -delete 2>/dev/null || true
            fi
          done
          # Bundled torchvision model weights / fixture images
          find "$SITE/torchvision" -type d -name "datasets" -exec rm -rf {} + 2>/dev/null || true
          # ONNX runtime CUDA provider (if installed; some deps pull it in)
          find "$SITE" -name "libonnxruntime_providers_cuda*" -delete 2>/dev/null || true
          find "$SITE" -name "libonnxruntime_providers_tensorrt*" -delete 2>/dev/null || true

          find "$TORCH_DIR" -name "*.so" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$TORCH_DIR" -name "*.so.*" -exec strip --strip-debug {} + 2>/dev/null || true

          echo "Size after: $(du -sh "$TORCH_DIR" | cut -f1)"

      # ROCm strip pass — mirrors the CUDA pass above for AMD's HIP
      # runtime. The wheel ships rocBLAS / MIOpen / hipblasLt which are
      # ~800MB-1.2GB combined; stripping the training-only and JIT-only
      # libs keeps the onefile under 4GB. RDNA2/RDNA3 inference uses
      # rocBLAS LT (different lib than rocBLAS) so we keep that one.
      - name: Strip ROCm from torch installation
        if: matrix.gpu_backend == 'rocm'
        run: |
          TORCH_DIR=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")
          SITE=$(python -c 'import site; print(site.getsitepackages()[0])')
          echo "Torch dir: $TORCH_DIR"
          echo "Size before: $(du -sh "$TORCH_DIR" | cut -f1)"

          # rocBLAS Tensile kernels — large fixture archive used for
          # training matmul shapes. Inference uses a much smaller subset.
          find "$TORCH_DIR" -path "*/rocblas*/library*" -delete 2>/dev/null || true
          find "$SITE" -path "*/rocblas/library*" -delete 2>/dev/null || true
          # MIOpen kernels database (training paths)
          find "$TORCH_DIR" -name "libMIOpen*train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libMIOpen*db*" -delete 2>/dev/null || true
          # RCCL (collective comm — multi-GPU training, not inference)
          find "$TORCH_DIR" -name "librccl*" -delete 2>/dev/null || true
          # hipFFT / hipsolver / hipsparse — most diffusion ops don't use these
          find "$TORCH_DIR" -name "libhipfft*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libhipsolver*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libhipsparse*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "librocfft*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "librocsolver*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "librocsparse*" -delete 2>/dev/null || true
          # Hip runtime debug variants
          find "$TORCH_DIR" -name "libamd*debug*" -delete 2>/dev/null || true
          # Triton (HIP backend is experimental; torch.compile is gated to CUDA only)
          find "$SITE" -type d -name "triton" -exec rm -rf {} + 2>/dev/null || true
          # caffe2 + tests + docs (same as CUDA strip)
          find "$TORCH_DIR" -type d -name "caffe2" -exec rm -rf {} + 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "benchmarks" -exec rm -rf {} + 2>/dev/null || true
          for PKG in torchvision diffusers transformers datasets peft; do
            if [ -d "$SITE/$PKG" ]; then
              find "$SITE/$PKG" -type d \( -name tests -o -name test -o -name docs -o -name "docs_src" -o -name examples -o -name benchmarks -o -name __pycache__ \) -exec rm -rf {} + 2>/dev/null || true
              find "$SITE/$PKG" -name "*.md" -delete 2>/dev/null || true
              find "$SITE/$PKG" -name "*.rst" -delete 2>/dev/null || true
              find "$SITE/$PKG" -name "*.pyi" -delete 2>/dev/null || true
            fi
          done

          find "$TORCH_DIR" -name "*.so" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$TORCH_DIR" -name "*.so.*" -exec strip --strip-debug {} + 2>/dev/null || true

          echo "Size after: $(du -sh "$TORCH_DIR" | cut -f1)"

      # Onefile: single compressed binary. GPU libs stripped above keep it under 4GB.
      - name: Build Python binary (Linux x64)
        run: |
          pyinstaller \
            --onefile \
            --strip \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild \
            --specpath $RUNNER_TEMP \
            --collect-submodules=engineio \
            --collect-submodules=socketio \
            --collect-submodules=diffusers \
            --collect-submodules=transformers \
            --collect-submodules=huggingface_hub \
            --collect-submodules=accelerate \
            --collect-submodules=safetensors \
            --collect-submodules=peft \
            --collect-submodules=datasets \
            --collect-submodules=qwen_tts \
            --collect-submodules=qwen_vl_utils \
            --collect-submodules=acestep \
            --collect-submodules=torch \
            --collect-submodules=realesrgan \
            --collect-submodules=basicsr \
            --collect-data=basicsr \
            --collect-submodules=imageio_ffmpeg \
            --collect-data=imageio_ffmpeg \
            --hidden-import=pytorch_lightning \
            --hidden-import=torchaudio \
            --hidden-import=torchaudio.functional \
            --hidden-import=torchvision \
            --hidden-import=torchvision.transforms \
            --hidden-import=soundfile \
            --hidden-import=compel \
            --hidden-import=onnxruntime \
            --hidden-import=psutil \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=torch.cuda \
            --hidden-import=torch.backends.cudnn \
            --hidden-import=cv2 \
            ${{ env.MAIN_PY_FILE }}

      - name: Verify Python binary
        run: |
          # onefile produces: binaries/<os>-<arch>/diffuser (single compressed binary)
          BINARY="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser"
          file "$BINARY"
          file "$BINARY" | grep -q "ELF 64-bit" || { echo "ERROR: Not a 64-bit binary!"; exit 1; }
          ls -lh "$BINARY"

      # PyInstaller has already bundled everything into the binary.
      # Remove Python packages, CUDA libs, pip cache, and PyInstaller workdir
      # to free ~10GB+ for Electron packaging.
      - name: Free Python disk space
        run: |
          pip cache purge 2>/dev/null || true
          rm -rf $RUNNER_TEMP/pybuild
          rm -rf ~/.cache/pip
          SITE_PKGS=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Removing $SITE_PKGS (~10GB of CUDA/torch packages)..."
          rm -rf "$SITE_PKGS"
          echo "Disk space after Python cleanup:"
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build llama.cpp RPC binaries
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          npm run build:rpc

      - name: Build Vite bundles
        env:
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
          VITE_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
        run: npm run build:vite

      - name: Package Electron app
        run: |
          npx electron-packager . BonzAI \
            --platform=linux \
            --arch=x64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo.png \
            --ignore="^/(dist|bonzai|binaries|out|\.venv|venv|build)$"

      # main.js expects: resources/server/python-runtime/linux-x64/diffuser + _internal/
      - name: Copy Python runtime to app
        run: |
          APP_RESOURCES="out/BonzAI-linux-x64/resources"
          DEST="$APP_RESOURCES/server/python-runtime/linux-x64"
          mkdir -p "$DEST"
          # onefile: copy single binary
          cp binaries/linux-x64/diffuser "$DEST/diffuser"
          chmod +x "$DEST/diffuser"
          echo "Python runtime copied:"
          ls -lh "$DEST/diffuser"

      # Raw binaries are now duplicated inside out/BonzAI-linux-x64/resources/ — remove originals
      - name: Remove duplicate binaries
        run: |
          rm -rf binaries/
          df -h /

      # Strip Electron app to reduce .deb size below GitHub's 2GB limit
      - name: Strip app for size
        run: |
          APP="out/BonzAI-linux-x64"
          echo "App size before stripping: $(du -sh "$APP" | cut -f1)"

          # Strip debug symbols from all .so files in the app
          find "$APP" -name "*.so" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$APP" -name "*.so.*" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$APP" -name "*.node" -exec strip --strip-debug {} + 2>/dev/null || true

          # Remove unnecessary Electron/Chromium files
          rm -rf "$APP/resources/app/node_modules/.cache" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/test" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/tests" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/__tests__" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/docs" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/example" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/examples" 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.md" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.ts" ! -name "*.d.ts" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.map" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "CHANGELOG*" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "LICENSE*" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "README*" -delete 2>/dev/null || true

          # Remove Electron locales except English
          LOCALES_DIR="$APP/locales"
          if [ -d "$LOCALES_DIR" ]; then
            find "$LOCALES_DIR" -name "*.pak" ! -name "en-US.pak" -delete 2>/dev/null || true
          fi

          # Remove source maps from Chromium
          find "$APP" -name "*.js.map" -delete 2>/dev/null || true

          # node-llama-cpp lives in devDependencies only (build-time source
          # bundle for llama-server compilation). It should not be in runtime
          # node_modules, but we prune defensively in case a lockfile quirk
          # leaves stale entries behind.
          rm -rf "$APP/resources/app/node_modules/node-llama-cpp" 2>/dev/null || true

          # NEW: @dimforge/rapier3d-compat JS build files duplicated per target
          find "$APP/resources/app/node_modules/@dimforge/rapier3d-compat" \
            -name "*.wasm.d.ts" -delete 2>/dev/null || true

          # NEW: three/examples docs & addons unused at runtime
          find "$APP/resources/app/node_modules/three" -type d \
            \( -name "docs" -o -name "editor" -o -name "manual" \
               -o -name "files" -o -name "screenshots" \) \
            -exec rm -rf {} + 2>/dev/null || true

          # NEW: electron's native modules — strip prebuilt binaries for
          # platforms other than linux-x64 (leftover from npm ci).
          find "$APP/resources/app/node_modules" -type d -name "prebuilds" | while read -r d; do
            find "$d" -mindepth 1 -maxdepth 1 -type d ! -name "linux-x64" ! -name "linux-*" -exec rm -rf {} + 2>/dev/null || true
          done

          echo "App size after stripping: $(du -sh "$APP" | cut -f1)"

      - name: Build .deb package (xz compressed)
        run: |
          TAG="${{ env.TAG }}"
          mkdir -p out/make

          # Build with electron-installer-debian
          npx electron-installer-debian \
            --src out/BonzAI-linux-x64 \
            --dest out/make \
            --arch amd64 \
            --options.name bonzai \
            --options.bin BonzAI \
            --options.productName BonzAI \
            --options.genericName "AI Desktop Application" \
            --options.description "1-click Sovereign AI deployment, training & serving" \
            --options.maintainer "BonzAI Foundation <team@bonzai.sh>" \
            --options.homepage "https://bonzai.sh" \
            --options.icon src/assets/logo.png \
            --options.categories "Utility;Science;ArtificialIntelligence" \
            --options.section misc

          # Rename — backend-suffixed so cuda + rocm releases coexist.
          DEB=$(ls out/make/*.deb | head -1)
          BACKEND="${{ matrix.gpu_backend }}"
          if [ -n "$DEB" ]; then
            mv "$DEB" "out/make/BonzAI-${TAG}-linux-amd64-${BACKEND}.deb"
          fi

          DEB_PATH="out/make/BonzAI-${TAG}-linux-amd64-${BACKEND}.deb"
          DEB_SIZE=$(stat --format='%s' "$DEB_PATH")
          echo "DEB size: $(echo $DEB_SIZE | numfmt --to=iec)"

          # If still over 2GB, repack with xz compression (dpkg-deb -Zxz)
          if [ "$DEB_SIZE" -gt 2000000000 ]; then
            echo "DEB exceeds 2GB, repacking with xz compression..."
            REPACK_DIR=$(mktemp -d)
            dpkg-deb -R "$DEB_PATH" "$REPACK_DIR"
            dpkg-deb -Zxz -z9 -Sextreme -b "$REPACK_DIR" "$DEB_PATH"
            rm -rf "$REPACK_DIR"
            DEB_SIZE=$(stat --format='%s' "$DEB_PATH")
            echo "Repacked DEB size: $(echo $DEB_SIZE | numfmt --to=iec)"
          fi

          # Split-into-parts fallback — if xz repack still exceeds 2GB,
          # split the .deb into ~1.9GB zip chunks so GitHub accepts each
          # asset. Users reassemble with: cat BonzAI-*.deb.part-* > BonzAI.deb
          if [ "$DEB_SIZE" -gt 2000000000 ]; then
            echo "DEB still exceeds 2GB after xz repack — splitting into parts"
            cd out/make
            split -b 1900M -d -a 2 "$(basename "$DEB_PATH")" "$(basename "$DEB_PATH").part-"
            echo "Split result:"
            ls -lh *.part-* 2>/dev/null | awk '{print $9, $5}'
            # Write a small README so users know how to reassemble.
            cat > "BonzAI-${TAG}-linux-amd64-${BACKEND}.README.txt" <<EOF
GitHub rejected the single .deb (>2GB). To reassemble:

  cat BonzAI-${TAG}-linux-amd64-${BACKEND}.deb.part-* > BonzAI-${TAG}-linux-amd64-${BACKEND}.deb
  sudo dpkg -i BonzAI-${TAG}-linux-amd64-${BACKEND}.deb

GPU backend: ${BACKEND} (use the cuda variant on NVIDIA, rocm on AMD).
Verify checksum if published alongside this file.
EOF
            # Remove the original oversize .deb so we only upload parts.
            rm -f "$(basename "$DEB_PATH")"
            cd - >/dev/null
          fi

          echo "Final package:"
          ls -lh out/make/

      - name: Disk report
        if: always()
        run: |
          df -h /
          du -sh out/make/* 2>/dev/null || true

      - name: Create Release & Upload
        run: |
          TAG="${{ env.TAG }}"
          ASSET="out/make/BonzAI-${TAG}-linux-amd64.deb"

          # Collect everything in out/make: either the single .deb or
          # the split .part-* chunks + README (split fallback). `ls -1`
          # of the dir returns every artifact we want to upload.
          cd out/make
          ASSETS=( $(ls -1) )
          cd - >/dev/null

          # Ensure the release exists (create if first upload, reuse otherwise).
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" \
              --title "BonzAI v${TAG}" \
              --generate-notes

          for f in "${ASSETS[@]}"; do
            FULL="out/make/$f"
            echo "Uploading: $FULL ($(stat --format='%s' "$FULL" | numfmt --to=iec))"
            gh release upload "${TAG}" "$FULL" --clobber
          done

          echo "Released Linux build for v${TAG}"

      - name: Mirror to bonzai-releases
        env:
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "RELEASES_PAT not configured, skipping mirror"
            exit 0
          fi
          export GH_TOKEN="$MIRROR_TOKEN"

          TAG="${{ env.TAG }}"
          # Upload every artifact in out/make (single .deb OR split parts + README).
          for FULL in out/make/*; do
            [ -f "$FULL" ] || continue
            gh release upload "$TAG" "$FULL" --clobber \
              --repo bonzai-depin/bonzai-releases \
              || echo "Mirror upload skipped for $FULL"
          done
