name: Release
on:
  release:
    types:
      - created

jobs:
  publish_on_mac:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: macos
      ARCH_KEY: arm64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CI: true
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps & PyInstaller
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install git+https://github.com/huggingface/transformers
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install pyinstaller==6.17.0

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild \
            --specpath $RUNNER_TEMP \
            --collect-submodules=engineio \
            --collect-submodules=socketio \
            --collect-submodules=diffusers \
            --collect-submodules=transformers \
            --collect-submodules=huggingface_hub \
            --collect-submodules=accelerate \
            --collect-submodules=safetensors \
            --collect-submodules=peft \
            --collect-submodules=datasets \
            --hidden-import=pytorch_lightning \
            --hidden-import=torchaudio \
            --hidden-import=torchaudio.functional \
            --hidden-import=torchvision \
            --hidden-import=torchvision.transforms \
            --hidden-import=soundfile \
            --hidden-import=compel \
            --hidden-import=onnxruntime \
            --hidden-import=psutil \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            ${{ env.MAIN_PY_FILE }}

      - name: Decode & Import Certificates
        env:
          CERT_BASE64: ${{ secrets.MAC_APP_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASS: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > app.p12
          echo "$INSTALLER_CERT_BASE64" | base64 --decode > installer.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security import app.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security import installer.p12 -k build.keychain -P "$INSTALLER_CERT_PASS" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

      - name: Sign Python runtime (onefile)
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application certificate found!"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          # With --onefile mode, we have a single executable
          BINARY_PATH="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser"

          echo "Signing onefile executable..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$BINARY_PATH"
          codesign --verify --verbose "$BINARY_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Sign ffmpeg binaries
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          # Sign ALL ffmpeg binaries (both architectures, ffmpeg and ffprobe)
          FFMPEG_BASE="node_modules/ffmpeg-static-electron-forge/dist/bin/darwin"
          for arch in arm64 x64; do
            for binary in ffmpeg ffprobe; do
              BINARY_PATH="$FFMPEG_BASE/$arch/$binary"
              if [ -f "$BINARY_PATH" ]; then
                echo "Signing: $BINARY_PATH"
                codesign --force --sign "$IDENTITY" \
                  --options runtime \
                  --entitlements ./entitlements.mac.plist \
                  --timestamp \
                  "$BINARY_PATH"
                codesign --verify --verbose "$BINARY_PATH"
              fi
            done
          done

      - name: Build Vite bundles
        run: npm run build:vite

      - name: Package Electron app
        run: |
          npx electron-packager . bonzai \
            --platform=darwin \
            --arch=arm64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo \
            --ignore="^/(dist|bonzai|binaries|out|\.venv|venv|build)$"

      - name: Copy Python runtime to app
        run: |
          APP_RESOURCES="out/bonzai-darwin-arm64/bonzai.app/Contents/Resources"
          mkdir -p "$APP_RESOURCES/server/python-runtime/macos-arm64"
          # With --onefile, copy the single executable
          cp binaries/macos-arm64/diffuser "$APP_RESOURCES/server/python-runtime/macos-arm64/"
          chmod +x "$APP_RESOURCES/server/python-runtime/macos-arm64/diffuser"
          echo "Copied diffuser executable (onefile) to app bundle"
          ls -la "$APP_RESOURCES/server/python-runtime/macos-arm64/"

      - name: Sign Electron app
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          APP_PATH="out/bonzai-darwin-arm64/bonzai.app"

          # Remove test directories that contain unsigned binaries we don't need
          echo "Removing unnecessary test assets..."
          find "$APP_PATH" -type d -name "test" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "tests" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "__tests__" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true

          # Sign ALL binaries: .dylib, .so, .node files and Mach-O executables
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing all native binaries..."
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.node" \) \
            -not -path "*/python-runtime/*" | while read -r binary; do
            echo "Signing: $binary"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$binary" 2>/dev/null || true
          done

          # Sign executables (Mach-O binaries without extensions)
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing executables..."
          find "$APP_PATH" -type f -perm +111 -not -path "*/python-runtime/*" | while read -r binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "Signing executable: $binary"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$binary" 2>/dev/null || true
            fi
          done

          # Sign frameworks from inside out (libraries first, then framework bundle)
          echo "Signing Electron Framework libraries..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Versions/*/Libraries/*" -type f | while read -r lib; do
            echo "Signing framework lib: $lib"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              "$lib" 2>/dev/null || true
          done

          # Sign helper apps and other executables in frameworks
          echo "Signing framework helpers..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Resources/*" -type f -perm +111 | while read -r helper; do
            if file "$helper" | grep -q "Mach-O"; then
              echo "Signing helper: $helper"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$helper" 2>/dev/null || true
            fi
          done

          # Sign all .framework bundles
          echo "Signing framework bundles..."
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d -depth | while read -r framework; do
            echo "Signing framework: $framework"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$framework"
          done

          # Sign any .app bundles inside (like helper apps)
          echo "Signing nested apps..."
          find "$APP_PATH" -name "*.app" -type d -depth | grep -v "^$APP_PATH$" | while read -r nested_app; do
            echo "Signing nested app: $nested_app"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$nested_app" 2>/dev/null || true
          done

          # Sign the main app bundle last
          echo "Signing main app bundle..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$APP_PATH"

          # Verify
          echo "Verifying signature..."
          codesign --verify --verbose=4 "$APP_PATH"
          echo "Checking for unsigned components..."
          codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "Deep verification completed (warnings above may be ignorable)"

      - name: Create DMG
        run: |
          mkdir -p out/make
          npx electron-installer-dmg \
            "out/bonzai-darwin-arm64/bonzai.app" \
            "bonzai-${{ github.event.release.tag_name }}-arm64" \
            --out=out/make \
            --overwrite

          # Verify DMG was created
          DMG_PATH="out/make/bonzai-${{ github.event.release.tag_name }}-arm64.dmg"
          if [ -f "$DMG_PATH" ]; then
            echo "DMG created successfully at: $DMG_PATH"
            ls -lh "$DMG_PATH"
          else
            echo "ERROR: DMG not found at expected path: $DMG_PATH"
            echo "Contents of out/make:"
            ls -la out/make/
            exit 1
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG_PATH="out/make/bonzai-${{ github.event.release.tag_name }}-arm64.dmg"

          # Submit and capture output
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o 'id: [a-f0-9-]*' | head -1 | cut -d' ' -f2)

          # Check if notarization failed
          if echo "$SUBMIT_OUTPUT" | grep -q "Invalid"; then
            echo "❌ Notarization failed. Fetching detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Upload DMG to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH="out/make/bonzai-${{ github.event.release.tag_name }}-arm64.dmg"
          gh release upload "${{ github.event.release.tag_name }}" "$DMG_PATH" --clobber
          echo "Uploaded: $DMG_PATH"
