name: Release
on:
  release:
    types:
      - created

jobs:
  publish_on_mac:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: macos
      ARCH_KEY: arm64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.x'
          architecture: 'arm64'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps & PyInstaller
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install git+https://github.com/huggingface/transformers
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install pyinstaller

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild \
            --specpath $RUNNER_TEMP \
            ${{ env.MAIN_PY_FILE }}

      - name: Decode & Import App Certificate
        env:
          CERT_BASE64: ${{ secrets.MAC_APP_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > app.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security import app.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

      - name: Decode & Import Installer Certificate
        env:
          CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > installer.p12
          security import installer.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

      - name: Sign Python binary (macOS ARM64)
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          BINARY_PATH="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser"
          if [ -f "$BINARY_PATH" ]; then
            codesign --force --sign "Developer ID Application" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$BINARY_PATH"
            echo "Signed Python binary: $BINARY_PATH"
            codesign --verify --verbose "$BINARY_PATH"
          else
            echo "Python binary not found at: $BINARY_PATH"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Sign ffmpeg binary (macOS ARM64)
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          FFMPEG_PATH="node_modules/ffmpeg-static-electron-forge/dist/bin/darwin/arm64/ffmpeg"

          if [ -f "$FFMPEG_PATH" ]; then
            codesign --force --sign "Developer ID Application" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$FFMPEG_PATH"
            echo "Signed ffmpeg at: $FFMPEG_PATH"
            codesign --verify --verbose "$FFMPEG_PATH"
          else
            echo "ffmpeg not found at: $FFMPEG_PATH"
            find node_modules/ffmpeg-static-electron-forge -name ffmpeg -type f || true
            exit 1
          fi

      - name: Build and Publish macOS ARM64 app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEBUG: electron-forge:*
        run: |
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          npm run publish

      - name: Verify and fallback upload ARM64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Build artifacts ==="
          find out -name "*.dmg" -type f 2>/dev/null || echo "No DMG in out/"
          ls -laR out/make 2>/dev/null || echo "out/make not found"

          echo ""
          echo "=== Current release assets ==="
          gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name' || echo "Could not fetch release assets"

          echo ""
          echo "=== Fallback upload if needed ==="
          DMG_FILE=$(find out -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$DMG_FILE" ]; then
            # Check if already uploaded by looking for any dmg with arm64 or similar
            EXISTING=$(gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name' | grep -i "arm64\|darwin" || true)
            if [ -z "$EXISTING" ]; then
              NEW_NAME="bonzai-${{ github.event.release.tag_name }}-arm64.dmg"
              cp "$DMG_FILE" "$NEW_NAME"
              echo "Forge publisher may have failed. Uploading manually: $NEW_NAME"
              gh release upload "${{ github.event.release.tag_name }}" "$NEW_NAME" --clobber
              echo "Uploaded: $NEW_NAME"
            else
              echo "DMG already attached to release: $EXISTING"
            fi
          else
            echo "No DMG file found to upload!"
            exit 1
          fi

