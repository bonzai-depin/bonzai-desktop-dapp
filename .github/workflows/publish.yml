name: Release (macOS)
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 2.0.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish_on_mac:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: macos
      ARCH_KEY: arm64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # TAG without leading v — works for both triggers:
      # release: tag_name may be "v2.0.0" or "2.0.0", strip leading v
      # workflow_dispatch: inputs.tag is always bare "2.0.0"
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          # Strip leading 'v' if present so TAG is always bare (e.g. "2.0.0")
          RAW="${{ env.RELEASE_TAG }}"
          echo "TAG=${RAW#v}" >> "$GITHUB_ENV"

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps
        run: |
          pip install "huggingface_hub>=0.34.0,<1.0"
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          # Install packages with --no-deps to avoid pulling in gradio/fastapi/sox
          pip install -U qwen-tts --no-deps
          pip install git+https://github.com/ace-step/ACE-Step-1.5.git --no-deps
          # mlx-vlm for Apple Silicon vision — must use --no-deps to avoid transformers 5.x
          pip install --no-deps mlx-vlm mlx-lm mlx mlx-metal

      # basicsr 1.4.2 (used by /video/enhance via realesrgan) imports
      # `torchvision.transforms.functional_tensor` which was removed in
      # torchvision >= 0.17. Patch the one offending import so the
      # bundled binary doesn't crash on first /video/enhance request.
      - name: Patch basicsr torchvision import
        shell: bash
        run: |
          python -c "
          import site, pathlib, sys
          for sp in site.getsitepackages() + [site.getusersitepackages()]:
              p = pathlib.Path(sp) / 'basicsr' / 'data' / 'degradations.py'
              if p.exists():
                  s = p.read_text()
                  new = s.replace(
                      'from torchvision.transforms.functional_tensor',
                      'from torchvision.transforms.functional',
                  )
                  if new != s:
                      p.write_text(new)
                      print(f'Patched: {p}')
                      sys.exit(0)
                  print(f'Already patched or unchanged: {p}')
                  sys.exit(0)
          print('basicsr/data/degradations.py not found; skipping')
          "

      # Privacy-pipeline smoke tests — codec round-trip + provider
      # blueprint loopback + runner-dispatch. Independent of model
      # weights; catches wire-format / codec / runner-registry
      # regressions before the multi-GB PyInstaller pass. See
      # publish-linux.yml for rationale.
      - name: Privacy-pipeline smoke tests
        run: |
          python src/server/pipeline_transport.py
          python scripts/smoke-shard-provider.py

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild \
            --specpath $RUNNER_TEMP \
            --collect-submodules=engineio \
            --collect-submodules=socketio \
            --collect-submodules=diffusers \
            --collect-submodules=transformers \
            --collect-submodules=huggingface_hub \
            --collect-submodules=accelerate \
            --collect-submodules=safetensors \
            --collect-submodules=peft \
            --collect-submodules=datasets \
            --collect-submodules=qwen_tts \
            --collect-submodules=qwen_vl_utils \
            --collect-submodules=acestep \
            --collect-submodules=mlx_vlm \
            --collect-submodules=mlx_lm \
            --collect-submodules=realesrgan \
            --collect-submodules=basicsr \
            --collect-data=basicsr \
            --collect-submodules=imageio_ffmpeg \
            --collect-data=imageio_ffmpeg \
            --hidden-import=mlx \
            --hidden-import=pytorch_lightning \
            --hidden-import=torchaudio \
            --hidden-import=torchaudio.functional \
            --hidden-import=torchvision \
            --hidden-import=torchvision.transforms \
            --hidden-import=soundfile \
            --hidden-import=compel \
            --hidden-import=onnxruntime \
            --hidden-import=psutil \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=cv2 \
            ${{ env.MAIN_PY_FILE }}

      - name: Decode & Import Certificates
        env:
          CERT_BASE64: ${{ secrets.MAC_APP_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASS: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > app.p12
          echo "$INSTALLER_CERT_BASE64" | base64 --decode > installer.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security import app.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security import installer.p12 -k build.keychain -P "$INSTALLER_CERT_PASS" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

      - name: Sign Python runtime (onefile)
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application certificate found!"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          # With --onefile mode, we have a single executable
          BINARY_PATH="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser"

          echo "Signing onefile executable..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$BINARY_PATH"
          codesign --verify --verbose "$BINARY_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build llama.cpp RPC binaries
        run: |
          brew install cmake
          npm run build:rpc

      - name: Sign llama.cpp RPC binaries
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          for binary in bin/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/rpc-server bin/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/llama-server; do
            if [ -f "$binary" ]; then
              echo "Signing: $binary"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$binary"
              codesign --verify --verbose "$binary"
            fi
          done

      - name: Sign ffmpeg binaries
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          # Sign ALL ffmpeg binaries (both architectures, ffmpeg and ffprobe)
          FFMPEG_BASE="node_modules/ffmpeg-static-electron-forge/dist/bin/darwin"
          for arch in arm64 x64; do
            for binary in ffmpeg ffprobe; do
              BINARY_PATH="$FFMPEG_BASE/$arch/$binary"
              if [ -f "$BINARY_PATH" ]; then
                echo "Signing: $BINARY_PATH"
                codesign --force --sign "$IDENTITY" \
                  --options runtime \
                  --entitlements ./entitlements.mac.plist \
                  --timestamp \
                  "$BINARY_PATH"
                codesign --verify --verbose "$BINARY_PATH"
              fi
            done
          done

      - name: Build Vite bundles
        env:
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
          VITE_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
        run: npm run build:vite

      - name: Package Electron app
        run: |
          npx electron-packager . BonzAI \
            --platform=darwin \
            --arch=arm64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo \
            --ignore="^/(dist|bonzai|binaries|out|\.venv|venv|build)$"

      - name: Copy Python runtime to app
        run: |
          APP_RESOURCES="out/BonzAI-darwin-arm64/BonzAI.app/Contents/Resources"
          mkdir -p "$APP_RESOURCES/server/python-runtime/macos-arm64"
          # With --onefile, copy the single executable
          cp binaries/macos-arm64/diffuser "$APP_RESOURCES/server/python-runtime/macos-arm64/"
          chmod +x "$APP_RESOURCES/server/python-runtime/macos-arm64/diffuser"
          echo "Copied diffuser executable (onefile) to app bundle"
          ls -la "$APP_RESOURCES/server/python-runtime/macos-arm64/"

      - name: Sign Electron app
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          APP_PATH="out/BonzAI-darwin-arm64/BonzAI.app"

          # Remove test directories that contain unsigned binaries we don't need
          echo "Removing unnecessary test assets..."
          find "$APP_PATH" -type d -name "test" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "tests" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "__tests__" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true

          # Sign ALL binaries: .dylib, .so, .node files and Mach-O executables
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing all native binaries..."
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.node" \) \
            -not -path "*/python-runtime/*" -not -path "*/llama-runtime/*" | while read -r binary; do
            echo "Signing: $binary"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$binary" 2>/dev/null || true
          done

          # Sign executables (Mach-O binaries without extensions)
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing executables..."
          find "$APP_PATH" -type f -perm +111 -not -path "*/python-runtime/*" -not -path "*/llama-runtime/*" | while read -r binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "Signing executable: $binary"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$binary" 2>/dev/null || true
            fi
          done

          # Sign frameworks from inside out (libraries first, then framework bundle)
          echo "Signing Electron Framework libraries..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Versions/*/Libraries/*" -type f | while read -r lib; do
            echo "Signing framework lib: $lib"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              "$lib" 2>/dev/null || true
          done

          # Sign helper apps and other executables in frameworks
          echo "Signing framework helpers..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Resources/*" -type f -perm +111 | while read -r helper; do
            if file "$helper" | grep -q "Mach-O"; then
              echo "Signing helper: $helper"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$helper" 2>/dev/null || true
            fi
          done

          # Sign all .framework bundles
          echo "Signing framework bundles..."
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d -depth | while read -r framework; do
            echo "Signing framework: $framework"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$framework"
          done

          # Sign any .app bundles inside (like helper apps)
          echo "Signing nested apps..."
          find "$APP_PATH" -name "*.app" -type d -depth | grep -v "^$APP_PATH$" | while read -r nested_app; do
            echo "Signing nested app: $nested_app"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$nested_app" 2>/dev/null || true
          done

          # Sign the main app bundle last
          echo "Signing main app bundle..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$APP_PATH"

          # Verify
          echo "Verifying signature..."
          codesign --verify --verbose=4 "$APP_PATH"
          echo "Checking for unsigned components..."
          codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "Deep verification completed (warnings above may be ignorable)"

      - name: Create DMG
        run: |
          mkdir -p out/make

          # Install create-dmg for better customization options
          brew install create-dmg

          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # create-dmg often fails on CI due to hdiutil detach timeout (DiskArbitration flake).
          # When this happens, the temp read-write DMG exists but was never converted to
          # the final compressed read-only DMG. We recover by force-detaching and converting manually.
          create-dmg \
            --volname "BonzAI" \
            --background "src/assets/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 512 512 \
            --icon-size 100 \
            --icon "BonzAI.app" 140 256 \
            --app-drop-link 372 256 \
            --text-size 14 \
            --no-internet-enable \
            "$DMG_PATH" \
            "out/BonzAI-darwin-arm64/BonzAI.app" && exit 0

          # create-dmg failed — recover from hdiutil detach timeout
          echo "create-dmg failed, attempting recovery..."

          # Force detach the stuck volume
          for disk in /dev/disk*; do
            hdiutil detach "$disk" -force 2>/dev/null || true
          done

          # Find the temp read-write DMG that create-dmg left behind
          RW_DMG=$(ls out/make/rw.*.dmg 2>/dev/null | head -1)
          if [ -z "$RW_DMG" ]; then
            echo "ERROR: No temporary DMG found to recover"
            ls -la out/make/
            exit 1
          fi

          echo "Found temp DMG: $RW_DMG — converting to final compressed DMG..."
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG_PATH"
          rm -f "$RW_DMG"

          if [ -f "$DMG_PATH" ]; then
            echo "DMG recovered successfully at: $DMG_PATH"
            ls -lh "$DMG_PATH"
          else
            echo "ERROR: DMG recovery failed"
            exit 1
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # Submit and capture output
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o 'id: [a-f0-9-]*' | head -1 | cut -d' ' -f2)

          # Check if notarization failed
          if echo "$SUBMIT_OUTPUT" | grep -q "Invalid"; then
            echo "❌ Notarization failed. Fetching detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Create Release & Upload DMG
        run: |
          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # Create the GitHub release (or upload to existing)
          # Tag is bare (e.g. "2.1.1"), title has the "v" prefix
          gh release create "${TAG}" "$DMG_PATH" \
            --title "BonzAI v${TAG}" \
            --generate-notes \
            || gh release upload "${TAG}" "$DMG_PATH" --clobber

          echo "Released: BonzAI v${TAG}"

      - name: Mirror to bonzai-releases
        env:
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "RELEASES_PAT not configured, skipping mirror"
            exit 0
          fi
          export GH_TOKEN="$MIRROR_TOKEN"

          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # Delete existing release with same tag if re-publishing
          gh release delete "$TAG" \
            --repo bonzai-depin/bonzai-releases \
            --yes 2>/dev/null || true

          # Create release with the DMG in the mirror repo
          # Tag is bare (e.g. "2.1.1"), title has the "v" prefix
          gh release create "$TAG" "$DMG_PATH" \
            --repo bonzai-depin/bonzai-releases \
            --title "BonzAI v${TAG}" \
            --generate-notes

          echo "Mirrored ${TAG} to bonzai-depin/bonzai-releases"
