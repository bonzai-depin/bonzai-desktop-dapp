name: Release (macOS)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v4.0.0-rc.1)'
        required: true
        type: string
      publish:
        description: 'Publish installers (false builds and validates only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TORCHVISION_WARN_WHEN_EXTENSION_LOADING_FAILS: "1"

concurrency:
  group: release-macos-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish_on_mac:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: macos
      ARCH_KEY: arm64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Preserve the exact ref for checkout and release publication.
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PUBLISH_RELEASE: ${{ github.event_name == 'release' || inputs.publish }}
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve version
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          version = json.load(open('package.json'))['version']
          if os.environ.get('PUBLISH_RELEASE') == 'true' and os.environ['RELEASE_TAG'].removeprefix('v') != version:
              raise SystemExit('Release tag must match package.json version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TAG={version}\n')
          PYCODE

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps
        run: |
          python scripts/install-python-deps.py --skip-torch
          # mlx-vlm for Apple Silicon vision; shared ML dependencies are owned above.
          pip install --no-deps mlx-vlm mlx-lm mlx mlx-metal

      # basicsr 1.4.2 (used by /video/enhance via realesrgan) imports
      # `torchvision.transforms.functional_tensor` which was removed in
      # torchvision >= 0.17. Patch the one offending import so the
      # bundled binary doesn't crash on first /video/enhance request.
      - name: Patch basicsr torchvision import
        shell: bash
        run: |
          python -c "
          import site, pathlib, sys
          for sp in site.getsitepackages() + [site.getusersitepackages()]:
              p = pathlib.Path(sp) / 'basicsr' / 'data' / 'degradations.py'
              if p.exists():
                  s = p.read_text()
                  new = s.replace(
                      'from torchvision.transforms.functional_tensor',
                      'from torchvision.transforms.functional',
                  )
                  if new != s:
                      p.write_text(new)
                      print(f'Patched: {p}')
                      sys.exit(0)
                  print(f'Already patched or unchanged: {p}')
                  sys.exit(0)
          print('basicsr/data/degradations.py not found; skipping')
          "

      # Privacy-pipeline smoke tests — codec round-trip + provider
      # blueprint loopback + runner-dispatch. Independent of model
      # weights; catches wire-format / codec / runner-registry
      # regressions before the multi-GB PyInstaller pass. See
      # linux-release.yml for rationale.
      - name: Privacy-pipeline smoke tests
        run: |
          python src/server/pipeline_transport.py
          python scripts/smoke-shard-provider.py

      - name: Smoke-test source inference runtime
        shell: bash
        run: |
          python test/test_torchvision_packaging.py
          python src/server/runtime_check.py

      - name: Build Python runtime
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean \
            --distpath "binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}" \
            --workpath "$RUNNER_TEMP/pybuild" diffuser.spec

      - name: Decode & Import Certificates
        if: github.event_name == 'release' || inputs.publish
        env:
          CERT_BASE64: ${{ secrets.MAC_APP_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASS: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > app.p12
          echo "$INSTALLER_CERT_BASE64" | base64 --decode > installer.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security import app.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security import installer.p12 -k build.keychain -P "$INSTALLER_CERT_PASS" -T /usr/bin/codesign
          rm -f app.p12 installer.p12
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

      - name: Sign Python runtime
        if: github.event_name == 'release' || inputs.publish
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application certificate found!"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          # Sign the complete onedir runtime before its launcher.
          BINARY_PATH="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/diffuser"

          find "binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser" -type f -print0 | while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q "Mach-O"; then
              codesign --force --sign "$IDENTITY" --options runtime \
                --entitlements ./entitlements.mac.plist --timestamp "$binary"
            fi
          done
          echo "Signing Python launcher..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$BINARY_PATH"
          codesign --verify --verbose "$BINARY_PATH"

      - name: Smoke-test frozen inference runtime
        shell: bash
        run: |
          binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/diffuser --bonzai-runtime-check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build llama.cpp RPC binaries
        run: |
          brew install cmake
          npm run build:rpc

      - name: Sign llama.cpp RPC binaries
        if: github.event_name == 'release' || inputs.publish
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          for binary in bin/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/rpc-server bin/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/llama-server; do
            if [ -f "$binary" ]; then
              echo "Signing: $binary"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$binary"
              codesign --verify --verbose "$binary"
            fi
          done

      - name: Sign ffmpeg binaries
        if: github.event_name == 'release' || inputs.publish
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          # Sign ALL ffmpeg binaries (both architectures, ffmpeg and ffprobe)
          FFMPEG_BASE="node_modules/ffmpeg-static-electron-forge/dist/bin/darwin"
          for arch in arm64 x64; do
            for binary in ffmpeg ffprobe; do
              BINARY_PATH="$FFMPEG_BASE/$arch/$binary"
              if [ -f "$BINARY_PATH" ]; then
                echo "Signing: $BINARY_PATH"
                codesign --force --sign "$IDENTITY" \
                  --options runtime \
                  --entitlements ./entitlements.mac.plist \
                  --timestamp \
                  "$BINARY_PATH"
                codesign --verify --verbose "$BINARY_PATH"
              fi
            done
          done

      - name: Build Vite bundles
        shell: bash
        env:
          BONZAI_VALIDATE_WEB3: ${{ vars.BONZAI_VALIDATE_WEB3 }}
          VITE_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          VITE_BONZAI_ECONOMY_CHAIN_ID: ${{ secrets.BONZAI_ECONOMY_CHAIN_ID }}
          VITE_ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          VITE_BONZAI_TOKEN_ROBINHOOD_ADDRESS: ${{ secrets.BONZAI_TOKEN_ROBINHOOD_ADDRESS }}
          VITE_BONZAI_UNLOCK_ADDRESS: ${{ secrets.BONZAI_UNLOCK_ADDRESS }}
          VITE_BONZAI_SKILL_REGISTRY_ADDRESS: ${{ secrets.BONZAI_SKILL_REGISTRY_ADDRESS }}
          VITE_BONZAI_SKILL_OWNERSHIP_ADDRESS: ${{ secrets.BONZAI_SKILL_OWNERSHIP_ADDRESS }}
          VITE_BONZAI_COLLECTIBLES_ADDRESS: ${{ secrets.BONZAI_COLLECTIBLES_ADDRESS }}
          VITE_BONZAI_COLLECTIBLES_FACTORY_ADDRESS: ${{ secrets.BONZAI_COLLECTIBLES_FACTORY_ADDRESS }}
          VITE_BONZAI_MINT_POOL_ADDRESS: ${{ secrets.BONZAI_MINT_POOL_ADDRESS }}
          VITE_BONZAI_ROYALTY_SPLITTER_ADDRESS: ${{ secrets.BONZAI_ROYALTY_SPLITTER_ADDRESS }}
          VITE_BONZAI_FINE_TUNE_TOKEN_FACTORY_ADDRESS: ${{ secrets.BONZAI_FINE_TUNE_TOKEN_FACTORY_ADDRESS }}
          VITE_BONZAI_COMPANIONS_ADDRESS: ${{ secrets.BONZAI_COMPANIONS_ADDRESS }}
          VITE_BONZAI_COMPANION_TOKEN_FACTORY_ADDRESS: ${{ secrets.BONZAI_COMPANION_TOKEN_FACTORY_ADDRESS }}
          VITE_BONZAI_PROVIDER_REGISTRY_ADDRESS: ${{ secrets.BONZAI_PROVIDER_REGISTRY_ADDRESS }}
          VITE_BONZAI_SERVICE_TIME_ADDRESS: ${{ secrets.BONZAI_SERVICE_TIME_ADDRESS }}
          VITE_BONZAI_STAKING_VAULT_ADDRESS: ${{ secrets.BONZAI_STAKING_VAULT_ADDRESS }}
          VITE_BONZAI_REVENUE_ROUTER_ADDRESS: ${{ secrets.BONZAI_REVENUE_ROUTER_ADDRESS }}
          VITE_BONZAI_CONTRIBUTION_REGISTRY_ADDRESS: ${{ secrets.BONZAI_CONTRIBUTION_REGISTRY_ADDRESS }}
          VITE_BONZAI_DATASET_REGISTRY_ADDRESS: ${{ secrets.BONZAI_DATASET_REGISTRY_ADDRESS }}
          VITE_BONZAI_MODEL_REGISTRY_ADDRESS: ${{ secrets.BONZAI_MODEL_REGISTRY_ADDRESS }}
          VITE_BONZAI_EVALUATION_REGISTRY_ADDRESS: ${{ secrets.BONZAI_EVALUATION_REGISTRY_ADDRESS }}
          VITE_BONZAI_CONTRIBUTION_SCORE_ORACLE_ADDRESS: ${{ secrets.BONZAI_CONTRIBUTION_SCORE_ORACLE_ADDRESS }}
          VITE_BONZAI_JOB_ESCROW_ADDRESS: ${{ secrets.BONZAI_JOB_ESCROW_ADDRESS }}
          VITE_BONZAI_UNISWAP_HOOK_ADDRESS: ${{ secrets.BONZAI_UNISWAP_HOOK_ADDRESS }}
          VITE_BONZAI_SKILL_ID_MAP_JSON: ${{ secrets.BONZAI_SKILL_ID_MAP_JSON }}
          VITE_UNISWAP_V4_POOL_MANAGER: ${{ secrets.UNISWAP_V4_POOL_MANAGER }}
          VITE_UNISWAP_V4_POSITION_MANAGER: ${{ secrets.UNISWAP_V4_POSITION_MANAGER }}
          VITE_UNISWAP_V4_UNIVERSAL_ROUTER: ${{ secrets.UNISWAP_V4_UNIVERSAL_ROUTER }}
          VITE_UNISWAP_V4_QUOTER: ${{ secrets.UNISWAP_V4_QUOTER }}
          VITE_UNISWAP_V4_STATE_VIEW: ${{ secrets.UNISWAP_V4_STATE_VIEW }}
        run: |
          if [ "$BONZAI_VALIDATE_WEB3" = "true" ]; then npm run web3:verify:offline; fi
          npm run build:vite

      - name: Package Electron app
        run: |
          npx electron-packager . BonzAI \
            --platform=darwin \
            --arch=arm64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo \
            --ignore="^/(\.local-release-archive|\.chart-data-[^/]*|\.codex-presentation-build|\.codex-finalizer|dist|bonzai|binaries|out|out-test|\.venv|venv|build|\.cache|\.git|test|docs|\.env.*)$"

      - name: Copy Python runtime to app
        run: |
          APP_RESOURCES="out/BonzAI-darwin-arm64/BonzAI.app/Contents/Resources"
          mkdir -p "$APP_RESOURCES/server/python-runtime/macos-arm64"
          # Copy the complete onedir runtime
          cp -a binaries/macos-arm64/diffuser/. "$APP_RESOURCES/server/python-runtime/macos-arm64/"
          chmod +x "$APP_RESOURCES/server/python-runtime/macos-arm64/diffuser"
          echo "Copied onedir runtime to app bundle"
          ls -la "$APP_RESOURCES/server/python-runtime/macos-arm64/"

      - name: Sign Electron app
        if: github.event_name == 'release' || inputs.publish
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Find the exact Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          APP_PATH="out/BonzAI-darwin-arm64/BonzAI.app"

          # Remove test directories that contain unsigned binaries we don't need
          echo "Removing unnecessary test assets..."
          find "$APP_PATH" -type d -name "test" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "tests" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type d -name "__tests__" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true

          # Sign ALL binaries: .dylib, .so, .node files and Mach-O executables
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing all native binaries..."
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.node" \) \
            -not -path "*/python-runtime/*" -not -path "*/llama-runtime/*" | while read -r binary; do
            echo "Signing: $binary"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$binary"
          done

          # Sign executables (Mach-O binaries without extensions)
          # EXCLUDE python-runtime as it's already signed with proper framework structure
          echo "Signing executables..."
          find "$APP_PATH" -type f -perm +111 -not -path "*/python-runtime/*" -not -path "*/llama-runtime/*" | while read -r binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "Signing executable: $binary"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$binary" 2>/dev/null || true
            fi
          done

          # Sign frameworks from inside out (libraries first, then framework bundle)
          echo "Signing Electron Framework libraries..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Versions/*/Libraries/*" -type f | while read -r lib; do
            echo "Signing framework lib: $lib"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              "$lib"
          done

          # Sign helper apps and other executables in frameworks
          echo "Signing framework helpers..."
          find "$APP_PATH/Contents/Frameworks" -path "*/Resources/*" -type f -perm +111 | while read -r helper; do
            if file "$helper" | grep -q "Mach-O"; then
              echo "Signing helper: $helper"
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --entitlements ./entitlements.mac.plist \
                --timestamp \
                "$helper" 2>/dev/null || true
            fi
          done

          # Sign all .framework bundles
          echo "Signing framework bundles..."
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d -depth | while read -r framework; do
            echo "Signing framework: $framework"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$framework"
          done

          # Sign any .app bundles inside (like helper apps)
          echo "Signing nested apps..."
          find "$APP_PATH" -name "*.app" -type d -depth | grep -v "^$APP_PATH$" | while read -r nested_app; do
            echo "Signing nested app: $nested_app"
            codesign --force --sign "$IDENTITY" \
              --options runtime \
              --entitlements ./entitlements.mac.plist \
              --timestamp \
              "$nested_app"
          done

          # Sign the main app bundle last
          echo "Signing main app bundle..."
          codesign --force --sign "$IDENTITY" \
            --options runtime \
            --entitlements ./entitlements.mac.plist \
            --timestamp \
            "$APP_PATH"

          # Verify
          echo "Verifying signature..."
          codesign --verify --verbose=4 "$APP_PATH"
          echo "Checking for unsigned components..."
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p out/make

          # Install create-dmg for better customization options
          brew install create-dmg

          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # create-dmg often fails on CI due to hdiutil detach timeout (DiskArbitration flake).
          # When this happens, the temp read-write DMG exists but was never converted to
          # the final compressed read-only DMG. We recover by force-detaching and converting manually.
          create-dmg \
            --volname "BonzAI" \
            --background "src/assets/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 512 512 \
            --icon-size 100 \
            --icon "BonzAI.app" 140 256 \
            --app-drop-link 372 256 \
            --text-size 14 \
            --no-internet-enable \
            "$DMG_PATH" \
            "out/BonzAI-darwin-arm64/BonzAI.app" && exit 0

          # create-dmg failed — recover from hdiutil detach timeout
          echo "create-dmg failed, attempting recovery..."

          # Force detach the stuck volume
          for disk in /dev/disk*; do
            hdiutil detach "$disk" -force
          done

          # Find the temp read-write DMG that create-dmg left behind
          RW_DMG=$(ls out/make/rw.*.dmg 2>/dev/null | head -1)
          if [ -z "$RW_DMG" ]; then
            echo "ERROR: No temporary DMG found to recover"
            ls -la out/make/
            exit 1
          fi

          echo "Found temp DMG: $RW_DMG — converting to final compressed DMG..."
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG_PATH"
          rm -f "$RW_DMG"

          if [ -f "$DMG_PATH" ]; then
            echo "DMG recovered successfully at: $DMG_PATH"
            ls -lh "$DMG_PATH"
          else
            echo "ERROR: DMG recovery failed"
            exit 1
          fi

      - name: Notarize DMG
        if: github.event_name == 'release' || inputs.publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          TAG="${{ env.TAG }}"
          DMG_PATH="out/make/BonzAI-${TAG}-arm64.dmg"

          # Submit and capture output
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o 'id: [a-f0-9-]*' | head -1 | cut -d' ' -f2)

          # Fail closed unless Apple explicitly accepted the submission.
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "❌ Notarization failed. Fetching detailed log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Prepare checksummed release assets
        shell: bash
        run: python scripts/release-assets.py prepare out/make

      - name: Upload release assets
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        run: python scripts/release-assets.py upload out/make --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Mirror to bonzai-releases
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            GH_TOKEN="$MIRROR_TOKEN" python scripts/release-assets.py upload out/make --tag "$RELEASE_TAG" --repo bonzai-depin/bonzai-releases
          fi

      - name: Save validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonzai-${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          path: out/make/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
