name: Build Executables

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    env:
      MAIN_PY_FILE: 'src/server/diffuser.py'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10.x

    # ──────────────── Extra deps ────────────────
    - name: Install Diffusers & PESQ
      run: |
        pip install git+https://github.com/huggingface/diffusers.git
        pip install https://github.com/vBaiCai/python-pesq/archive/master.zip

    - name: Install nightly PyTorch (macOS)
      if: runner.os == 'macOS'
      run: |
        pip install --no-cache-dir --upgrade --pre \
          torch torchvision torchaudio \
          --index-url https://download.pytorch.org/whl/nightly/cpu

    - name: Install nightly PyTorch (Linux/Windows)
      if: runner.os != 'macOS'
      run: |
        pip install --no-cache-dir --upgrade --pre \
          torch torchvision torchaudio \
          --index-url https://download.pytorch.org/whl/nightly/cu128
          # for GPU support you can swap `cpu` with e.g. `cu118`

    # ──────────────── Your existing steps ────────────────
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
      working-directory: ./

    - name: Install PyInstaller
      run: |
        pip install pyinstaller
      working-directory: ./

    - name: Build executable
      run: |
        pyinstaller ${{ env.MAIN_PY_FILE }}
      working-directory: ./

    - name: Create Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v3
      with:
        name: windows-executables
        path: dist/

    - name: Create Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v3
      with:
        name: linux-executables
        path: dist/

    - name: Create Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v3
      with:
        name: macos-executables
        path: dist/

    - name: List files in dist folder
      run: ls -R ./dist/
