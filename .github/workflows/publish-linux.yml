name: Release (Linux)
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 2.1.2)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish_on_linux:
    runs-on: ubuntu-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: linux
      ARCH_KEY: x64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CI: true
    steps:
      # Free ~30GB by removing pre-installed tools we don't need.
      # CUDA PyTorch + PyInstaller + Electron need significant disk space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          RAW="${{ env.RELEASE_TAG }}"
          echo "TAG=${RAW#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install CUDA-enabled PyTorch for full GPU performance on NVIDIA GPUs.
      # cu124 = CUDA 12.4, compatible with drivers 525+. The PyInstaller binary
      # will fall back to CPU if no NVIDIA GPU is present at runtime.
      - name: Install PyTorch (CUDA 12.4)
        run: |
          pip install --no-cache-dir --upgrade \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cu124

      - name: Install Python deps
        run: |
          pip install "huggingface_hub>=0.34.0,<1.0"
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install -U qwen-tts --no-deps
          pip install git+https://github.com/ace-step/ACE-Step-1.5.git --no-deps

      # Strip CUDA libs BEFORE PyInstaller bundles them — keeps onefile under 4GB
      - name: Strip CUDA from torch installation
        run: |
          TORCH_DIR=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")
          echo "Torch dir: $TORCH_DIR"
          echo "Size before: $(du -sh "$TORCH_DIR" | cut -f1)"

          # Remove training-only and unused CUDA libs from the installed torch package
          find "$TORCH_DIR" -name "libnvJitLink*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnvrtc*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcupti*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnvToolsExt*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcurand*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_*_train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_adv*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_heur*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcudnn_cnn_train*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libnccl*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcusparse*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcufft*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libcusolver*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libtorch_python*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -name "libc10d*" -delete 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "caffe2" -exec rm -rf {} + 2>/dev/null || true
          # Remove cuBLAS (huge, only needed for large GEMM — inference uses cuBLASLt instead)
          find "$TORCH_DIR" -name "libcublas.so*" -delete 2>/dev/null || true
          # Remove nvptx compiler libs (JIT compilation, not needed at runtime)
          find "$TORCH_DIR" -name "libnvptxcompiler*" -delete 2>/dev/null || true
          # Remove Triton (JIT kernel compiler, not needed for inference)
          find "$(python -c 'import site; print(site.getsitepackages()[0])')" -type d -name "triton" -exec rm -rf {} + 2>/dev/null || true
          # Remove test/benchmark files from torch
          find "$TORCH_DIR" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$TORCH_DIR" -type d -name "benchmarks" -exec rm -rf {} + 2>/dev/null || true

          find "$TORCH_DIR" -name "*.so" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$TORCH_DIR" -name "*.so.*" -exec strip --strip-debug {} + 2>/dev/null || true

          echo "Size after: $(du -sh "$TORCH_DIR" | cut -f1)"

      # Onefile: single compressed binary. CUDA libs stripped above keep it under 4GB.
      - name: Build Python binary (Linux x64)
        run: |
          pyinstaller \
            --onefile \
            --strip \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild \
            --specpath $RUNNER_TEMP \
            --collect-submodules=engineio \
            --collect-submodules=socketio \
            --collect-submodules=diffusers \
            --collect-submodules=transformers \
            --collect-submodules=huggingface_hub \
            --collect-submodules=accelerate \
            --collect-submodules=safetensors \
            --collect-submodules=peft \
            --collect-submodules=datasets \
            --collect-submodules=qwen_tts \
            --collect-submodules=qwen_vl_utils \
            --collect-submodules=acestep \
            --collect-submodules=torch \
            --hidden-import=pytorch_lightning \
            --hidden-import=torchaudio \
            --hidden-import=torchaudio.functional \
            --hidden-import=torchvision \
            --hidden-import=torchvision.transforms \
            --hidden-import=soundfile \
            --hidden-import=compel \
            --hidden-import=onnxruntime \
            --hidden-import=psutil \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=torch.cuda \
            --hidden-import=torch.backends.cudnn \
            ${{ env.MAIN_PY_FILE }}

      - name: Verify Python binary
        run: |
          # onefile produces: binaries/<os>-<arch>/diffuser (single compressed binary)
          BINARY="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser"
          file "$BINARY"
          file "$BINARY" | grep -q "ELF 64-bit" || { echo "ERROR: Not a 64-bit binary!"; exit 1; }
          ls -lh "$BINARY"

      # PyInstaller has already bundled everything into the binary.
      # Remove Python packages, CUDA libs, pip cache, and PyInstaller workdir
      # to free ~10GB+ for Electron packaging.
      - name: Free Python disk space
        run: |
          pip cache purge 2>/dev/null || true
          rm -rf $RUNNER_TEMP/pybuild
          rm -rf ~/.cache/pip
          SITE_PKGS=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Removing $SITE_PKGS (~10GB of CUDA/torch packages)..."
          rm -rf "$SITE_PKGS"
          echo "Disk space after Python cleanup:"
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build llama.cpp RPC binaries
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          npm run build:rpc

      - name: Build Vite bundles
        env:
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
          VITE_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
        run: npm run build:vite

      - name: Package Electron app
        run: |
          npx electron-packager . BonzAI \
            --platform=linux \
            --arch=x64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo.png \
            --ignore="^/(dist|bonzai|binaries|out|\.venv|venv|build)$"

      # main.js expects: resources/server/python-runtime/linux-x64/diffuser + _internal/
      - name: Copy Python runtime to app
        run: |
          APP_RESOURCES="out/BonzAI-linux-x64/resources"
          DEST="$APP_RESOURCES/server/python-runtime/linux-x64"
          mkdir -p "$DEST"
          # onefile: copy single binary
          cp binaries/linux-x64/diffuser "$DEST/diffuser"
          chmod +x "$DEST/diffuser"
          echo "Python runtime copied:"
          ls -lh "$DEST/diffuser"

      # Raw binaries are now duplicated inside out/BonzAI-linux-x64/resources/ — remove originals
      - name: Remove duplicate binaries
        run: |
          rm -rf binaries/
          df -h /

      # Strip Electron app to reduce .deb size below GitHub's 2GB limit
      - name: Strip app for size
        run: |
          APP="out/BonzAI-linux-x64"
          echo "App size before stripping: $(du -sh "$APP" | cut -f1)"

          # Strip debug symbols from all .so files in the app
          find "$APP" -name "*.so" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$APP" -name "*.so.*" -exec strip --strip-debug {} + 2>/dev/null || true
          find "$APP" -name "*.node" -exec strip --strip-debug {} + 2>/dev/null || true

          # Remove unnecessary Electron/Chromium files
          rm -rf "$APP/resources/app/node_modules/.cache" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/test" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/tests" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/__tests__" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/docs" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/example" 2>/dev/null || true
          rm -rf "$APP/resources/app/node_modules/**/examples" 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.md" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.ts" ! -name "*.d.ts" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "*.map" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "CHANGELOG*" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "LICENSE*" -delete 2>/dev/null || true
          find "$APP/resources/app/node_modules" -name "README*" -delete 2>/dev/null || true

          # Remove Electron locales except English
          LOCALES_DIR="$APP/locales"
          if [ -d "$LOCALES_DIR" ]; then
            find "$LOCALES_DIR" -name "*.pak" ! -name "en-US.pak" -delete 2>/dev/null || true
          fi

          # Remove source maps from Chromium
          find "$APP" -name "*.js.map" -delete 2>/dev/null || true

          echo "App size after stripping: $(du -sh "$APP" | cut -f1)"

      - name: Build .deb package (xz compressed)
        run: |
          TAG="${{ env.TAG }}"
          mkdir -p out/make

          # Build with electron-installer-debian
          npx electron-installer-debian \
            --src out/BonzAI-linux-x64 \
            --dest out/make \
            --arch amd64 \
            --options.name bonzai \
            --options.bin BonzAI \
            --options.productName BonzAI \
            --options.genericName "AI Desktop Application" \
            --options.description "1-click Sovereign AI deployment, training & serving" \
            --options.maintainer "BonzAI Foundation <team@bonzai.sh>" \
            --options.homepage "https://bonzai.sh" \
            --options.icon src/assets/logo.png \
            --options.categories "Utility;Science;ArtificialIntelligence" \
            --options.section misc

          # Rename
          DEB=$(ls out/make/*.deb | head -1)
          if [ -n "$DEB" ]; then
            mv "$DEB" "out/make/BonzAI-${TAG}-linux-amd64.deb"
          fi

          DEB_PATH="out/make/BonzAI-${TAG}-linux-amd64.deb"
          DEB_SIZE=$(stat --format='%s' "$DEB_PATH")
          echo "DEB size: $(echo $DEB_SIZE | numfmt --to=iec)"

          # If still over 2GB, repack with xz compression (dpkg-deb -Zxz)
          if [ "$DEB_SIZE" -gt 2000000000 ]; then
            echo "DEB exceeds 2GB, repacking with xz compression..."
            REPACK_DIR=$(mktemp -d)
            dpkg-deb -R "$DEB_PATH" "$REPACK_DIR"
            dpkg-deb -Zxz -b "$REPACK_DIR" "$DEB_PATH"
            rm -rf "$REPACK_DIR"
            echo "Repacked DEB size: $(stat --format='%s' "$DEB_PATH" | numfmt --to=iec)"
          fi

          echo "Final package:"
          ls -lh out/make/

      - name: Disk report
        if: always()
        run: |
          df -h /
          du -sh out/make/* 2>/dev/null || true

      - name: Create Release & Upload
        run: |
          TAG="${{ env.TAG }}"
          ASSET="out/make/BonzAI-${TAG}-linux-amd64.deb"

          if [ -f "$ASSET" ]; then
            echo "Uploading: $ASSET ($(stat --format='%s' "$ASSET" | numfmt --to=iec))"
            gh release upload "${TAG}" "$ASSET" --clobber \
              || gh release create "${TAG}" "$ASSET" \
                --title "BonzAI v${TAG}" \
                --generate-notes
          fi

          echo "Released Linux build for v${TAG}"

      - name: Mirror to bonzai-releases
        env:
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "RELEASES_PAT not configured, skipping mirror"
            exit 0
          fi
          export GH_TOKEN="$MIRROR_TOKEN"

          TAG="${{ env.TAG }}"
          ASSET="out/make/BonzAI-${TAG}-linux-amd64.deb"

          if [ -f "$ASSET" ]; then
            gh release upload "$TAG" "$ASSET" --clobber \
              --repo bonzai-depin/bonzai-releases \
              || echo "Mirror upload skipped"
          fi
