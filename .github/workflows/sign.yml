name: Sign & Notarize Artifacts

# 1) Trigger after your Build workflow completes successfully
on:
  workflow_run:
    workflows: ["Build & Comment Artifacts"]
    types: [completed]

jobs:
  sign_macos:
    name: Sign & Notarize macOS
    if: >
      github.event.workflow_run.conclusion == 'success'
      && contains(fromJson('["macos-arm64","macos-x64"]'),
                  format('{0}-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha))
    runs-on: macos-latest
    env:
      APPLE_ID:                    ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
      MAC_CERT_BASE64:             ${{ secrets.MAC_APP_CERT_BASE64 }}
      MAC_CERT_PASSWORD:           ${{ secrets.MAC_APP_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD:           ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Download Electron macOS artifact
        uses: actions/download-artifact@v3
        with:
          name: electron-macos
          path: ./dist

      - name: Download Python binary artifact (macOS)
        uses: actions/download-artifact@v3
        with:
          name: python-macos
          path: ./binaries

      - name: Create & unlock temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain :contentReference[oaicite:5]{index=5}

      - name: Import Developer ID certificate
        run: |
          echo "$MAC_CERT_BASE64" | base64 --decode > /tmp/devid.p12
          security import /tmp/devid.p12 \
            -k ~/Library/Keychains/build.keychain \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign :contentReference[oaicite:6]{index=6}

      - name: Codesign Python binary
        run: |
          BIN="./binaries/python-macos/diffuser"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application: ${APPLE_ID}" "$BIN" :contentReference[oaicite:7]{index=7}

      - name: Codesign Electron .app bundle
        run: |
          APP="./dist/Electron-darwin*/bonzai.app"
          codesign --force --deep --timestamp --options runtime \
            --sign "Developer ID Application: ${APPLE_ID}" "$APP" :contentReference[oaicite:8]{index=8}

      - name: Notarize & Staple
        run: |
          xcrun notarytool submit "$APP" \
            --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" :contentReference[oaicite:9]{index=9}
          xcrun stapler staple "$APP" :contentReference[oaicite:10]{index=10}

      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: signed-macos
          path: |
            ./dist
            ./binaries/python-macos

