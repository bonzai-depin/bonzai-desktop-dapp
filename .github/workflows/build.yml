name: Build
on: [push, pull_request]

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        linux
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Install OpenBLAS & pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Set up Python (Linux x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Linux x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make

  build_on_mac:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      arm64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: 'arm64'

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app (ARM64)
        run: npm run make

  build_on_mac_intel:
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (macOS x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: 'x64'

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app (x64)
        run: npm run make -- --arch=x64

  build_on_win:
    runs-on: windows-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        windows
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (Windows x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Windows x64)
        run: |
          mkdir binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller `
            --onefile `
            --distpath binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }} `
            --workpath build `
            --specpath build `
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make
