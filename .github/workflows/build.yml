name: Build & Attach Executables

on:
  push:
  pull_request:

jobs:
  build_on_linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        linux
      ARCH_KEY:      x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install OpenBLAS & pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Set up Python (Linux x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'       # SciPy wheels available 

      - name: Install nightly PyTorch (CUDA 12.8)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cu128

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Linux x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os_key }}
          path: binaries/linux-x64/  # PyInstaller onefile output :contentReference[oaicite:3]{index=3}

  build_on_mac:
    name: Build on macOS ARM64
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: 'arm64'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app (ARM64)
        run: npm run make

      - name: Upload macOS ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os_key }}
          path: binaries/macos-arm64/  # matches CI output :contentReference[oaicite:4]{index=4}

  build_on_mac_intel:
    name: Build on macOS x64
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python (macOS x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: 'x64'

      - name: Install nightly PyTorch (CPU)
        run: |
          pip install --no-cache-dir --upgrade --pre \
            torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app (x64)
        run: npm run make -- --arch=x64

      - name: Upload macOS x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os_key }}
          path: binaries/macos-x64/

  build_on_win:
    name: Build on Windows x64
    runs-on: windows-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        windows
      ARCH_KEY:      x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python (Windows x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'

      - name: Install nightly PyTorch (CUDA 12.8)
        run: |
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }} -Force
          pyinstaller `
            --onefile `
            --distpath binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }} `
            --workpath build `
            --specpath build `
            $env:MAIN_PY_FILE   # PowerShell syntax :contentReference[oaicite:5]{index=5}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os_key }}
          path: binaries/windows-x64/

  comment-artifacts:
    name: Comment PR with artifacts link
    needs:
      - build_on_linux
      - build_on_mac
      - build_on_mac_intel
      - build_on_win
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Post comment with artifacts URL
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const pr = context.payload.pull_request.number;
            // Artifacts page for this run:
            const url = `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: `✅ **Build & Package Complete!**  
              Download your executables here: ${url}`
            });
