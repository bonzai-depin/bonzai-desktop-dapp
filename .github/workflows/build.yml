# .github/workflows/build.yml
name: Build & Comment Artifacts

on: pull_request

jobs:
  build:
    name: Build Python & Electron
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            arch: x64
          - os: macos-latest
            os_key: macos
            arch: arm64
          - os: macos-latest
            os_key: macos
            arch: x64
          - os: windows-latest
            os_key: windows
            arch: x64

    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        ${{ matrix.os_key }}
      ARCH_KEY:      ${{ matrix.arch }}
      APPLE_ID:                   ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
      MAC_APP_CERT_PASSWORD:      ${{ secrets.MAC_APP_CERT_PASSWORD }}
      MAC_INSTALLER_CERT_PASSWORD:  ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD:          ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v3

      # ── free up space on Linux runners ───────────────────────────────
      - name: Free up disk space (Linux)
        if: matrix.os_key == 'linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      # ── Python + PyInstaller deps ───────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: ${{ matrix.os_key == 'macos' && matrix.arch || '' }}

      - name: Install Python deps & PyInstaller
        if: runner.os != 'Windows'
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --pre --upgrade \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --pre --upgrade \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install -r requirements.txt pyinstaller

      - name: Install Python deps & PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git `
                      https://github.com/vBaiCai/python-pesq/archive/master.zip `
                      --pre --upgrade torch torchvision torchaudio `
                      --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install -r requirements.txt pyinstaller

      # ── Build one-file Python binary ────────────────────────────────
      - name: Build Python binary (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p binaries/${OS_KEY}-${ARCH_KEY}
          pyinstaller \
            --distpath binaries/${OS_KEY}-${ARCH_KEY} \
            --workpath $RUNNER_TEMP/pybuild-${OS_KEY}-${ARCH_KEY} \
            diffuser.spec

      - name: Build Python binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory binaries\${OS_KEY}-${ARCH_KEY} -Force
          pyinstaller --distpath binaries\${OS_KEY}-${ARCH_KEY} `
                      --workpath $env:RUNNER_TEMP\pybuild-${OS_KEY}-${ARCH_KEY} `
                      diffuser.spec

      # ── Build & sign/notarize via Forge ────────────────────────────
      - uses: actions/setup-node@v3
        with: { node-version: 20 }

      - run: npm ci

      - name: Build Electron
        run: |
          if [[ "${{ matrix.os_key }}" == "macos" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi
        env:
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

      # ── Upload only the Python artifact ─────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: python-${OS_KEY}-${ARCH_KEY}
          path: binaries/${OS_KEY}-${ARCH_KEY}/

  comment:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const resp = await github.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
            const lines = resp.data.artifacts.map(a => {
              const u = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${a.id}`;
              return `- [${a.name}](${u})`;
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.payload.pull_request.number,
              body: ['🔧 **Build artifacts are ready!**','','…', ...lines].join('\n')
            });