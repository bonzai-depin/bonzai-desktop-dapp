name: Build
on: [push, pull_request]

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        linux
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (Linux x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'         # pick up 3.14.x or alpha/beta :contentReference[oaicite:1]{index=1}
          allow-prereleases: true        # allow pre-releases if no GA available :contentReference[oaicite:2]{index=2}

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Linux x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make

  build_on_mac:
    # ARM64 macOS runner
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      arm64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (macOS ARM64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          allow-prereleases: true
          architecture: 'arm64'          # explicitly request ARM64 interpreter :contentReference[oaicite:3]{index=3}

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS ARM64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Electron app (ARM64)
        run: npm run make

  build_on_mac_intel:
    # Intel macOS runner
    runs-on: macos-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        macos
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (macOS x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          allow-prereleases: true
          architecture: 'x64'            # explicitly request x64 interpreter

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (macOS x64)
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller \
            --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath build \
            --specpath build \
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Electron app (x64)
        run: npm run make -- --arch=x64

  build_on_win:
    runs-on: windows-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        windows
      ARCH_KEY:      x64
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python (Windows x64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          allow-prereleases: true        # Windows uses host arch by default

      - name: Install Python deps & PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary (Windows x64)
        run: |
          mkdir binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller ^
            --onefile ^
            --distpath binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }} ^
            --workpath build ^
            --specpath build ^
            $MAIN_PY_FILE

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run make
