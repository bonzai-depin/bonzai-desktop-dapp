name: Build & Comment Artifacts

on:
  pull_request:

jobs:
  build:
    name: Build Python & Electron
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   os_key: linux
          #   arch: x64
          - os: macos-latest
            os_key: macos
            arch: arm64
          - os: macos-latest
            os_key: macos
            arch: x64
          - os: windows-latest
            os_key: windows
            arch: x64

    env:
      MAIN_PY_FILE: src/server/diffuser.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ─── FREE UP SPACE ON LINUX ──────────────────────────────────────
      # This removes large preinstalled toolchains to reclaim several GB
      # - name: Free up disk space (Linux)
      #   if: matrix.os_key == 'linux'
      #   run: |
      #     sudo rm -rf /usr/share/dotnet
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf "/usr/local/share/boost"
      #     sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.x"
          # on macOS only: select arm64 or x64
          architecture: ${{ matrix.os_key == 'macos' && matrix.arch || '' }}

      # ─── Install extra deps & PyInstaller ───
      - name: Install Diffusers & PESQ + PyInstaller (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install pyinstaller

      - name: Install Diffusers & PESQ + PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install pyinstaller

      # ─── Build Python binary ───
      - name: Build Python binary (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p binaries/${{ matrix.os_key }}-${{ matrix.arch }}
          pyinstaller \
            --distpath binaries/${{ matrix.os_key }}-${{ matrix.arch }} \
            --workpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
            diffuser.spec

      - name: Build Python binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory binaries\${{ matrix.os_key }}-${{ matrix.arch }} -Force
          pyinstaller `
            --distpath binaries\${{ matrix.os_key }}-${{ matrix.arch }} `
            --workpath $env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }} `
            diffuser.spec

      # ─── Build Electron app ───
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        shell: bash
        run: |
          if [[ "${{ matrix.os_key }}" == "macos" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi

      # ─── Upload Python binary artifact ───
      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os_key }}-${{ matrix.arch }}
          path: binaries/${{ matrix.os_key }}-${{ matrix.arch }}/

  comment:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            // Use the 'rest.actions' namespace and the correct parameter name:
            const resp = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId
            });
            const lines = resp.data.artifacts.map(a => {
              const u = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${a.id}`;
              return `- [${a.name}](${u})`;
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              body: ['🔧 **Build artifacts are ready!**', '', ...lines].join('\n')
            });
