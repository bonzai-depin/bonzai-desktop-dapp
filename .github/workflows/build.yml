name: Build & Comment Artifacts

on:
  pull_request:

jobs:
  build:
    name: Build Python Binaries & Electron App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            arch: x64
            shell: bash
          - os: macos-latest
            os_key: macos
            arch: arm64
            shell: bash
          - os: macos-latest
            os_key: macos
            arch: x64
            shell: bash
          - os: windows-latest
            os_key: windows
            arch: x64
            shell: pwsh

    env:
      MAIN_PY_FILE: src/server/diffuser.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: ${{ matrix.arch }}

      - name: Install extra deps & PyInstaller
        shell: ${{ matrix.shell }}
        run: |
          # Diffusers & PESQ
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip

          # nightly PyTorch
          if (${{ matrix.shell }} -eq 'pwsh') {
            pip install --no-cache-dir --upgrade --pre `
              torch torchvision torchaudio `
              --index-url https://download.pytorch.org/whl/nightly/cu128
          } else
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              pip install --no-cache-dir --upgrade --pre \
                torch torchvision torchaudio \
                --index-url https://download.pytorch.org/whl/nightly/cpu
            else
              pip install --no-cache-dir --upgrade --pre \
                torch torchvision torchaudio \
                --index-url https://download.pytorch.org/whl/nightly/cu128
            fi
          fi

          # your app deps + PyInstaller
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary
        shell: ${{ matrix.shell }}
        run: |
          $dist = "binaries/${{ matrix.os_key }}-${{ matrix.arch }}"
          if (${{ matrix.shell }} -eq 'pwsh') {
            New-Item -ItemType Directory $dist -Force
            pyinstaller --onefile `
              --distpath $dist `
              --workpath $env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }} `
              --specpath $env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }} `
              $env:MAIN_PY_FILE
          } else {
            mkdir -p $dist
            pyinstaller --onefile \
              --distpath $dist \
              --workpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
              --specpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
              $MAIN_PY_FILE
          }

      - name: Set up Node.js & build Electron
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node deps
        run: npm install

      - name: Build Electron app
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi

      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os_key }}-${{ matrix.arch }}
          path: binaries/${{ matrix.os_key }}-${{ matrix.arch }}/

  comment:
    name: Comment PR with Artifacts Link
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const pr = context.payload.pull_request.number;
            const url = `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: `🔧 **Build artifacts are ready!**  
              Download the Python binaries here: ${url}`
            });
