# .github/workflows/build-and-comment.yml
name: Build & Comment Artifacts

on:
  pull_request:

jobs:
  build:
    name: Build Python + Electron
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}
      ARCH_KEY:      ${{ matrix.os == 'windows-latest' && 'x64' || matrix.os == 'macos-latest' && 'arm64' || 'x64' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: ${{ matrix.os == 'macos-latest' && 'arm64' || matrix.os == 'windows-latest' && 'x64' || '' }}

      # ───────── UNIX (macOS/Linux) extra deps & PyInstaller ─────────
      - name: Install extra deps & PyInstaller (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          # nightly PyTorch:
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install -r requirements.txt
          pip install pyinstaller

      # ───────── Windows extra deps & PyInstaller ─────────
      - name: Install extra deps & PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python binary
        run: |
          mkdir -p binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          pyinstaller --onefile \
            --distpath binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --workpath $RUNNER_TEMP/pybuild-${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            --specpath $RUNNER_TEMP/pybuild-${{ env.OS_KEY }}-${{ env.ARCH_KEY }} \
            $MAIN_PY_FILE

      - name: Set up Node.js & build Electron
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi

      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          path: binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/

  comment:
    name: Comment PR with Artifacts Link
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const pr = context.payload.pull_request.number;
            const url = `https://github.com/${owner}/${repo}/suites/${runId}/artifacts`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: `🔧 **Build artifacts are ready!**\n\nDownload the Python binaries here:\n${url}`
            });
