name: Build & Comment Artifacts

on:
  pull_request:

jobs:
  build:
    name: Build Python & Electron
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            arch: x64
          - os: macos-latest
            os_key: macos
            arch: arm64
          - os: macos-latest
            os_key: macos
            arch: x64
          - os: windows-latest
            os_key: windows
            arch: x64

    env:
      MAIN_PY_FILE: src/server/diffuser.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          architecture: ${{ matrix.os_key == 'macos' && matrix.arch || '' }}

      # ─── Install UPX ─────────────────────────────────────────────
      - name: Install UPX on Linux
        if: matrix.os_key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl                       # UPX compressor package :contentReference[oaicite:0]{index=0}

      - name: Install UPX on macOS
        if: matrix.os_key == 'macos'
        run: |
          brew install upx                                      # Homebrew UPX formula :contentReference[oaicite:1]{index=1}

      - name: Install UPX on Windows
        if: matrix.os_key == 'windows'
        shell: pwsh
        run: |
          choco install upx -y                                  # Chocolatey UPX package :contentReference[oaicite:2]{index=2}

      # ─── Install extra deps & PyInstaller ────────────────────────
      - name: Install dependencies & PyInstaller
        shell: bash
        if: runner.os != 'Windows'
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install -r requirements.txt
          pip install pyinstaller                              # PyInstaller for our onefile build :contentReference[oaicite:3]{index=3}

      - name: Install dependencies & PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install -r requirements.txt
          pip install pyinstaller                              # :contentReference[oaicite:4]{index=4}

      # ─── Build & UPX-compress Python binary ───────────────────────
      - name: Build & compress Python binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p binaries/${{ matrix.os_key }}-${{ matrix.arch }}
          pyinstaller --onefile \
            --distpath binaries/${{ matrix.os_key }}-${{ matrix.arch }} \
            --workpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
            --specpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
            $MAIN_PY_FILE                                    # initial onefile build
          upx binaries/${{ matrix.os_key }}-${{ matrix.arch }}/diffuser  # pack the ELF binary :contentReference[oaicite:5]{index=5}

      - name: Build & compress Python binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "binaries/${{ matrix.os_key }}-${{ matrix.arch }}"
          New-Item -ItemType Directory $dist -Force
          pyinstaller --onefile `
            --distpath $dist `
            --workpath $env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }} `
            --specpath $env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }} `
            $env:MAIN_PY_FILE
          upx "$dist\diffuser.exe"                           # compress the Windows exe :contentReference[oaicite:6]{index=6}

      # ─── Build Electron app ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron app
        shell: bash
        run: |
          if [[ "${{ matrix.os_key }}" == "macos" ]] && [[ "${{ matrix.arch }}" == "x64" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi                                                    # Forge packaging 

      # ─── Upload Python binary artifact ───────────────────────────
      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os_key }}-${{ matrix.arch }}
          path: binaries/${{ matrix.os_key }}-${{ matrix.arch }}/  # smaller, compressed binary :contentReference[oaicite:8]{index=8}

  comment:
    name: Comment PR with Artifacts Link
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const url = `https://github.com/${owner}/${repo}/suites/${context.runId}/artifacts`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr,
              body: `🔧 **Build artifacts are ready!**  \nDownload here: ${url}`
            });
