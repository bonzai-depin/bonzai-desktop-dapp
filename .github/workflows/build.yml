name: Release
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            arch: x64
          - os: macos-latest
            os_key: macos
            arch: arm64
          - os: macos-latest
            os_key: macos
            arch: x64
          - os: windows-latest
            os_key: windows
            arch: x64

    env:
      MAIN_PY_FILE: src/server/diffuser.py
      # forge publisher uses GITHUB_TOKEN
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.x"
          architecture: ${{ matrix.os_key == 'macos' && matrix.arch || '' }}

      # ── Python deps (same shape as your Build job) ───────────────────────────
      - name: Install Diffusers & PESQ + PyInstaller (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install pyinstaller

      - name: Install Diffusers & PESQ + PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install pyinstaller

      # ── Avoid 4GB archive: force onedir ONLY on Linux/Windows ────────────────
      - name: Force onedir in PyInstaller spec (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp diffuser.spec diffuser.spec.bak
          sed -i 's/onefile=True/onefile=False/g' diffuser.spec
          sed -i 's/debug=True/debug=False/g' diffuser.spec

      - name: Force onedir in PyInstaller spec (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item diffuser.spec diffuser.spec.bak
          (Get-Content diffuser.spec) `
            -replace 'onefile=True','onefile=False' `
            -replace 'debug=True','debug=False' | Set-Content diffuser.spec

      # ── Build Python binary ──────────────────────────────────────────────────
      - name: Build Python binary (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p binaries/${{ matrix.os_key }}-${{ matrix.arch }}
          pyinstaller \
            --distpath binaries/${{ matrix.os_key }}-${{ matrix.arch }} \
            --workpath $RUNNER_TEMP/pybuild-${{ matrix.os_key }}-${{ matrix.arch }} \
            diffuser.spec

      - name: Build Python binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "binaries\${{ matrix.os_key }}-${{ matrix.arch }}" | Out-Null
          pyinstaller `
            --distpath "binaries\${{ matrix.os_key }}-${{ matrix.arch }}" `
            --workpath "$env:RUNNER_TEMP\pybuild-${{ matrix.os_key }}-${{ matrix.arch }}" `
            diffuser.spec

      # ── macOS: import certs & expose Apple creds for Forge notarization ──────
      - name: Decode & Import App Certificate
        if: matrix.os_key == 'macos'
        env:
          CERT_BASE64: ${{ secrets.MAC_APP_CERT_BASE64 }}
          CERT_PASS:   ${{ secrets.MAC_APP_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > app.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security import app.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

      - name: Decode & Import Installer Certificate
        if: matrix.os_key == 'macos'
        env:
          CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          CERT_PASS:   ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > installer.p12
          security import installer.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign

      - name: Expose Apple Credentials
        if: matrix.os_key == 'macos'
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "MAC_CODESIGN_IDENTITY=${{ secrets.MAC_CODESIGN_IDENTITY }}" >> $GITHUB_ENV

      - name: Sign Python binary (macOS)
        if: matrix.os_key == 'macos'
        env:
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          
          BINARY_PATH="binaries/${{ matrix.os_key }}-${{ matrix.arch }}/diffuser"
          if [ -f "$BINARY_PATH" ]; then
            codesign --force --sign "Developer ID Application" \
              --options runtime \
              --entitlements build/entitlements.mac.plist \
              "$BINARY_PATH"
            echo "Signed Python binary: $BINARY_PATH"
          fi

      # ── Node & Forge publish ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      # Build & publish for the current matrix target
      - name: Publish with Electron Forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          if [[ "${{ matrix.os_key }}" == "macos" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run publish -- --arch=x64
          else
            npm run publish
          fi