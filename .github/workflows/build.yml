# .github/workflows/build.yml
name: Build & Comment Artifacts

on:
  pull_request:

jobs:
  build:
    name: Build Python & Electron
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            arch: x64
          - os: macos-latest
            os_key: macos
            arch: arm64
          - os: macos-latest
            os_key: macos
            arch: x64
          - os: windows-latest
            os_key: windows
            arch: x64

    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY:        ${{ matrix.os_key }}
      ARCH_KEY:      ${{ matrix.arch }}
      APPLE_ID:                   ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
      MAC_APP_CERT_PASSWORD:      ${{ secrets.MAC_APP_CERT_PASSWORD }}
      MAC_INSTALLER_CERT_PASSWORD:  ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD:          ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ─── FREE UP SPACE ON LINUX ──────────────────────────────────────
      # This removes large preinstalled toolchains to reclaim several GB
      - name: Free up disk space (Linux)
        if: matrix.os_key == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"    # $AGENT_TOOLSDIRECTORY holds toolcache :contentReference[oaicite:0]{index=0}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.x"
          # on macOS only: select arm64 or x64
          architecture: ${{ matrix.os_key == 'macos' && matrix.arch || '' }}

      # ─── Install extra deps & PyInstaller ───
      - name: Install Diffusers & PESQ + PyInstaller (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cpu
          else
            pip install --no-cache-dir --upgrade --pre \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/nightly/cu128
          fi
          pip install pyinstaller

      - name: Install Diffusers & PESQ + PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install --no-cache-dir --upgrade --pre `
            torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/nightly/cu128
          pip install pyinstaller

      # ── Build one-file Python binary ────────────────────────────────
      - name: Build Python binary
        shell: bash
        run: |
          mkdir -p binaries/${OS_KEY}-${ARCH_KEY}
          pyinstaller \
            --distpath binaries/${OS_KEY}-${ARCH_KEY} \
            --workpath $RUNNER_TEMP/pybuild-${OS_KEY}-${ARCH_KEY} \
            diffuser.spec

      # ── On macOS: codesign & notarize the Python binary ─────────────
      - name: Create & unlock keychain (macOS)
        if: matrix.os_key == 'macos'
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

      - name: Import Developer ID cert (macOS)
        if: matrix.os_key == 'macos'
        run: |
          echo "${MAC_APP_CERT_BASE64}" | base64 -d > /tmp/app.p12
          security import /tmp/app.p12 \
            -k ~/Library/Keychains/build.keychain \
            -P "$MAC_APP_CERT_PASSWORD" \
            -T /usr/bin/codesign

      - name: Codesign Python binary (macOS)
        if: matrix.os_key == 'macos'
        run: |
          BIN="binaries/${OS_KEY}-${ARCH_KEY}/diffuser"
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: ${APPLE_ID}" "$BIN"

      - name: Zip & Notarize Python binary (macOS)
        if: matrix.os_key == 'macos'
        run: |
          ZIP="py-${OS_KEY}-${ARCH_KEY}.zip"
          zip -j "$ZIP" "binaries/${OS_KEY}-${ARCH_KEY}/diffuser"
          xcrun notarytool submit "$ZIP" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      # ── Build Electron app (with its nested binary) ─────────────────
      - uses: actions/setup-node@v3
        with: { node-version: 20 }

      - name: Install Node deps
        run: npm ci

      - name: Build & Sign/Notarize Electron
        shell: bash
        env:
          # reuse the same Apple creds for Forge
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          CSC_NAME: "Developer ID Application: ${APPLE_ID}"
        run: |
          if [[ "${{ matrix.os_key }}" == "macos" && "${{ matrix.arch }}" == "x64" ]]; then
            npm run make -- --arch=x64
          else
            npm run make
          fi

      # ── Upload the Python artifact (for debugging) ───────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: python-${OS_KEY}-${ARCH_KEY}
          path: binaries/${OS_KEY}-${ARCH_KEY}/

  comment:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const resp = await github.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
            const lines = resp.data.artifacts.map(a => {
              const u = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${a.id}`;
              return `- [${a.name}](${u})`;
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.payload.pull_request.number,
              body: ['🔧 **Build artifacts are ready!**','','…', ...lines].join('\n')
            });