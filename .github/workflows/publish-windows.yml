name: Release (Windows)
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 2.1.2)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish_on_windows:
    runs-on: windows-latest
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: windows
      ARCH_KEY: x64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        shell: bash
        run: |
          RAW="${{ env.RELEASE_TAG }}"
          echo "TAG=${RAW#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install CUDA-enabled PyTorch for full GPU performance on NVIDIA GPUs.
      # cu124 = CUDA 12.4, compatible with drivers 525+. The PyInstaller binary
      # will fall back to CPU if no NVIDIA GPU is present at runtime.
      - name: Install PyTorch (CUDA 12.4)
        run: |
          pip install --no-cache-dir --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124

      - name: Install Python deps
        run: |
          pip install "huggingface_hub>=0.34.0,<1.0"
          pip install git+https://github.com/huggingface/diffusers.git
          pip install -r requirements.txt
          pip install https://github.com/vBaiCai/python-pesq/archive/master.zip
          pip install -U qwen-tts --no-deps
          pip install git+https://github.com/ace-step/ACE-Step-1.5.git --no-deps

      # Use --onedir instead of --onefile: CUDA PyTorch exceeds the 4GB
      # uint32 limit for onefile CArchive. onedir produces an executable +
      # _internal/ folder with shared libraries — no size limit.
      - name: Build Python binary (Windows x64)
        run: |
          pyinstaller `
            --onedir `
            --distpath "binaries\${{ env.OS_KEY }}-${{ env.ARCH_KEY }}" `
            --workpath "$env:RUNNER_TEMP\pybuild" `
            --specpath "$env:RUNNER_TEMP" `
            --collect-submodules=engineio `
            --collect-submodules=socketio `
            --collect-submodules=diffusers `
            --collect-submodules=transformers `
            --collect-submodules=huggingface_hub `
            --collect-submodules=accelerate `
            --collect-submodules=safetensors `
            --collect-submodules=peft `
            --collect-submodules=datasets `
            --collect-submodules=qwen_tts `
            --collect-submodules=qwen_vl_utils `
            --collect-submodules=acestep `
            --collect-submodules=torch `
            --hidden-import=pytorch_lightning `
            --hidden-import=torchaudio `
            --hidden-import=torchaudio.functional `
            --hidden-import=torchvision `
            --hidden-import=torchvision.transforms `
            --hidden-import=soundfile `
            --hidden-import=compel `
            --hidden-import=onnxruntime `
            --hidden-import=psutil `
            --hidden-import=PIL `
            --hidden-import=PIL.Image `
            --hidden-import=torch.cuda `
            --hidden-import=torch.backends.cudnn `
            "${{ env.MAIN_PY_FILE }}"

      - name: Verify Python binary
        shell: bash
        run: |
          # onedir produces: binaries/<os>-<arch>/diffuser/diffuser.exe + _internal/
          BINARY="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/diffuser.exe"
          file "$BINARY"
          file "$BINARY" | grep -q "PE32+" || { echo "ERROR: Not a 64-bit PE executable!"; exit 1; }
          ls -lh "$BINARY"
          echo "Internal deps:"
          ls binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/_internal/ | head -20

      # Convert PNG to ICO for Windows — electron-packager requires .ico on win32
      - name: Generate Windows icon
        shell: bash
        run: |
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('src/assets/logo.png')
          img.save('src/assets/logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          "
          ls -lh src/assets/logo.ico

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite bundles
        env:
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: npm run build:vite

      - name: Package Electron app
        shell: bash
        run: |
          npx electron-packager . BonzAI \
            --platform=win32 \
            --arch=x64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo.ico \
            --ignore="^/(dist|bonzai|binaries|out|\.venv|venv|build)$"

      # main.js expects: resources/server/python-runtime/windows-x64/diffuser.exe + _internal/
      - name: Copy Python runtime to app
        shell: bash
        run: |
          APP_RESOURCES="out/BonzAI-win32-x64/resources"
          DEST="$APP_RESOURCES/server/python-runtime/windows-x64"
          mkdir -p "$DEST"
          # onedir: copy executable + _internal/ folder
          cp -r binaries/windows-x64/diffuser/* "$DEST/"
          echo "Python runtime copied:"
          ls -lh "$DEST/diffuser.exe"
          echo "Internal deps: $(ls "$DEST/_internal/" | wc -l) items"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $TAG = "${{ env.TAG }}"
          $ROOT = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "$ROOT\out\make"

          # Pass absolute paths to avoid relative path resolution issues
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="$TAG" `
            /DMySourceDir="$ROOT\out\BonzAI-win32-x64" `
            /DMyOutputDir="$ROOT\out\make" `
            /DMyIconFile="$ROOT\src\assets\logo.ico" `
            /F"BonzAI-$TAG-windows-x64-setup" `
            "$ROOT\installer\windows\setup.iss"

          Write-Host "Installer created:"
          Get-ChildItem "$ROOT\out\make\" | Format-Table Name, Length

      - name: Create Release & Upload
        shell: bash
        run: |
          TAG="${{ env.TAG }}"
          ASSET="out/make/BonzAI-${TAG}-windows-x64-setup.exe"

          if [ ! -f "$ASSET" ]; then
            echo "ERROR: No installer found"
            ls -la out/make/
            exit 1
          fi

          echo "Uploading: $ASSET"
          gh release upload "${TAG}" "$ASSET" --clobber \
            || gh release create "${TAG}" "$ASSET" \
              --title "BonzAI v${TAG}" \
              --generate-notes

          echo "Released Windows installer for v${TAG}"

      - name: Mirror to bonzai-releases
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "RELEASES_PAT not configured, skipping mirror"
            exit 0
          fi
          export GH_TOKEN="$MIRROR_TOKEN"

          TAG="${{ env.TAG }}"
          ASSET="out/make/BonzAI-${TAG}-windows-x64-setup.exe"

          gh release upload "$TAG" "$ASSET" --clobber \
            --repo bonzai-depin/bonzai-releases \
            || echo "Mirror upload skipped (release may not exist yet)"
