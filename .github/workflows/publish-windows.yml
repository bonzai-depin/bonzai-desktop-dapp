name: Release (Windows)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v4.0.0-rc.1)'
        required: true
        type: string
      publish:
        description: 'Publish installers (false builds and validates only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TORCHVISION_WARN_WHEN_EXTENSION_LOADING_FAILS: "1"
  LLAMA_CPP_REF: a30fb4924dcfec81c1b2c20634bd47fa4403061a

concurrency:
  group: release-windows-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish_on_windows:
    runs-on: windows-2025
    env:
      MAIN_PY_FILE: src/server/diffuser.py
      OS_KEY: windows
      ARCH_KEY: x64
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
      AWS_DEFAULT_REGION: auto
      PUBLISH_RELEASE: ${{ github.event_name == 'release' || inputs.publish }}
      CI: true
      # Cross-vendor GGUF acceleration; never silently ship a CPU-only build.
      BONZAI_LLAMA_BACKEND: vulkan
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve version
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          version = json.load(open('package.json'))['version']
          if os.environ.get('PUBLISH_RELEASE') == 'true' and os.environ['RELEASE_TAG'].removeprefix('v') != version:
              raise SystemExit('Release tag must match package.json version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TAG={version}\n')
          PYCODE

      # Validate the interface before downloading/freezing the large inference stack.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      # Validate native GPU packaging before the large Python dependency build.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK download failed' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw 'Invalid Vulkan SDK installer signature' }
          $setup = Start-Process -FilePath $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($setup.ExitCode)" }
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (!(Test-Path "$sdk\Bin\glslc.exe")) { throw 'Vulkan shader compiler is missing' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore native GPU build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bin/windows-x64
            src/server/scripts/convert_hf_to_gguf.py
          key: windows-vulkan-v1-${{ env.LLAMA_CPP_REF }}-${{ env.VULKAN_VERSION }}-${{ hashFiles('scripts/build-llama-rpc.js', 'scripts/llama-build-targets.mjs') }}

      - name: Build llama.cpp RPC binaries
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          npm run build:rpc

      # Cache compilation separately; every restored runtime still runs all checks.
      - name: Cache native GPU build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bin/windows-x64
            src/server/scripts/convert_hf_to_gguf.py
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Verify native GPU package and CPU fallback
        run: node scripts/verify-windows-gguf.mjs bin/windows-x64

      - name: Install Node dependencies
        env:
          # BonzAI builds its own standalone llama runtime below.
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Build Vite bundles
        shell: bash
        env:
          # The renderer dependency graph exceeds Node's default 2 GB heap.
          NODE_OPTIONS: --max-old-space-size=6144
          BONZAI_VALIDATE_WEB3: ${{ vars.BONZAI_VALIDATE_WEB3 }}
          VITE_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          VITE_BONZAI_ECONOMY_CHAIN_ID: ${{ secrets.BONZAI_ECONOMY_CHAIN_ID }}
          VITE_ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          VITE_BONZAI_TOKEN_ROBINHOOD_ADDRESS: ${{ secrets.BONZAI_TOKEN_ROBINHOOD_ADDRESS }}
          VITE_BONZAI_UNLOCK_ADDRESS: ${{ secrets.BONZAI_UNLOCK_ADDRESS }}
          VITE_BONZAI_SKILL_REGISTRY_ADDRESS: ${{ secrets.BONZAI_SKILL_REGISTRY_ADDRESS }}
          VITE_BONZAI_SKILL_OWNERSHIP_ADDRESS: ${{ secrets.BONZAI_SKILL_OWNERSHIP_ADDRESS }}
          VITE_BONZAI_COLLECTIBLES_ADDRESS: ${{ secrets.BONZAI_COLLECTIBLES_ADDRESS }}
          VITE_BONZAI_COLLECTIBLES_FACTORY_ADDRESS: ${{ secrets.BONZAI_COLLECTIBLES_FACTORY_ADDRESS }}
          VITE_BONZAI_MINT_POOL_ADDRESS: ${{ secrets.BONZAI_MINT_POOL_ADDRESS }}
          VITE_BONZAI_ROYALTY_SPLITTER_ADDRESS: ${{ secrets.BONZAI_ROYALTY_SPLITTER_ADDRESS }}
          VITE_BONZAI_FINE_TUNE_TOKEN_FACTORY_ADDRESS: ${{ secrets.BONZAI_FINE_TUNE_TOKEN_FACTORY_ADDRESS }}
          VITE_BONZAI_COMPANIONS_ADDRESS: ${{ secrets.BONZAI_COMPANIONS_ADDRESS }}
          VITE_BONZAI_COMPANION_TOKEN_FACTORY_ADDRESS: ${{ secrets.BONZAI_COMPANION_TOKEN_FACTORY_ADDRESS }}
          VITE_BONZAI_PROVIDER_REGISTRY_ADDRESS: ${{ secrets.BONZAI_PROVIDER_REGISTRY_ADDRESS }}
          VITE_BONZAI_SERVICE_TIME_ADDRESS: ${{ secrets.BONZAI_SERVICE_TIME_ADDRESS }}
          VITE_BONZAI_STAKING_VAULT_ADDRESS: ${{ secrets.BONZAI_STAKING_VAULT_ADDRESS }}
          VITE_BONZAI_REVENUE_ROUTER_ADDRESS: ${{ secrets.BONZAI_REVENUE_ROUTER_ADDRESS }}
          VITE_BONZAI_CONTRIBUTION_REGISTRY_ADDRESS: ${{ secrets.BONZAI_CONTRIBUTION_REGISTRY_ADDRESS }}
          VITE_BONZAI_DATASET_REGISTRY_ADDRESS: ${{ secrets.BONZAI_DATASET_REGISTRY_ADDRESS }}
          VITE_BONZAI_MODEL_REGISTRY_ADDRESS: ${{ secrets.BONZAI_MODEL_REGISTRY_ADDRESS }}
          VITE_BONZAI_EVALUATION_REGISTRY_ADDRESS: ${{ secrets.BONZAI_EVALUATION_REGISTRY_ADDRESS }}
          VITE_BONZAI_CONTRIBUTION_SCORE_ORACLE_ADDRESS: ${{ secrets.BONZAI_CONTRIBUTION_SCORE_ORACLE_ADDRESS }}
          VITE_BONZAI_JOB_ESCROW_ADDRESS: ${{ secrets.BONZAI_JOB_ESCROW_ADDRESS }}
          VITE_BONZAI_UNISWAP_HOOK_ADDRESS: ${{ secrets.BONZAI_UNISWAP_HOOK_ADDRESS }}
          VITE_BONZAI_SKILL_ID_MAP_JSON: ${{ secrets.BONZAI_SKILL_ID_MAP_JSON }}
          VITE_UNISWAP_V4_POOL_MANAGER: ${{ secrets.UNISWAP_V4_POOL_MANAGER }}
          VITE_UNISWAP_V4_POSITION_MANAGER: ${{ secrets.UNISWAP_V4_POSITION_MANAGER }}
          VITE_UNISWAP_V4_UNIVERSAL_ROUTER: ${{ secrets.UNISWAP_V4_UNIVERSAL_ROUTER }}
          VITE_UNISWAP_V4_QUOTER: ${{ secrets.UNISWAP_V4_QUOTER }}
          VITE_UNISWAP_V4_STATE_VIEW: ${{ secrets.UNISWAP_V4_STATE_VIEW }}
        run: |
          if [ "$BONZAI_VALIDATE_WEB3" = "true" ]; then npm run web3:verify:offline; fi
          npm run build:vite
          node scripts/verify-renderer-materials.mjs

      # Install nightly CUDA-enabled PyTorch for full GPU performance on NVIDIA
      # GPUs. The PyInstaller binary falls back to CPU when CUDA is unavailable.
      - name: Install nightly PyTorch (CUDA 13.0)
        run: |
          pip install --no-cache-dir --upgrade --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu130

      - name: Install Python deps
        run: |
          python scripts/install-python-deps.py --skip-torch

      # Privacy-pipeline smoke tests — see linux-release.yml for rationale.
      # Python on Windows may not expose socket.AF_UNIX, so the provider
      # worker falls back to loopback TCP while preserving the same frame
      # protocol.
      - name: Privacy-pipeline smoke tests
        shell: bash
        run: |
          python src/server/pipeline_transport.py
          python scripts/smoke-shard-provider.py

      # basicsr 1.4.2 (used by /video/enhance via realesrgan) imports
      # `torchvision.transforms.functional_tensor` which was removed in
      # torchvision >= 0.17. Patch the one offending import so the
      # bundled binary doesn't crash on first /video/enhance request.
      - name: Patch basicsr torchvision import
        shell: bash
        run: |
          python -c "
          import site, pathlib, sys
          for sp in site.getsitepackages() + [site.getusersitepackages()]:
              p = pathlib.Path(sp) / 'basicsr' / 'data' / 'degradations.py'
              if p.exists():
                  s = p.read_text()
                  new = s.replace(
                      'from torchvision.transforms.functional_tensor',
                      'from torchvision.transforms.functional',
                  )
                  if new != s:
                      p.write_text(new)
                      print(f'Patched: {p}')
                      sys.exit(0)
                  print(f'Already patched or unchanged: {p}')
                  sys.exit(0)
          print('basicsr/data/degradations.py not found; skipping')
          "

      # Use --onedir instead of --onefile: CUDA PyTorch exceeds the 4GB
      # uint32 limit for onefile CArchive. onedir produces an executable +
      # _internal/ folder with shared libraries — no size limit.
      - name: Smoke-test source inference runtime
        shell: bash
        run: |
          python test/test_torchvision_packaging.py
          python src/server/runtime_check.py

      - name: Build Python runtime
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean \
            --distpath "binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}" \
            --workpath "$RUNNER_TEMP/pybuild" diffuser.spec

      - name: Verify Python binary
        shell: bash
        run: |
          # onedir produces: binaries/<os>-<arch>/diffuser/diffuser.exe + _internal/
          BINARY="binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/diffuser.exe"
          file "$BINARY"
          file "$BINARY" | grep -q "PE32+" || { echo "ERROR: Not a 64-bit PE executable!"; exit 1; }
          ls -lh "$BINARY"
          echo "Internal deps:"
          ls binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/_internal/ | head -20

      # Convert PNG to ICO for Windows — electron-packager requires .ico on win32
      - name: Generate Windows icon
        shell: bash
        run: |
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('src/assets/logo.png')
          img.save('src/assets/logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          "
          ls -lh src/assets/logo.ico

      - name: Smoke-test frozen inference runtime
        shell: bash
        run: |
          binaries/${{ env.OS_KEY }}-${{ env.ARCH_KEY }}/diffuser/diffuser.exe --bonzai-runtime-check

      - name: Package Electron app
        shell: bash
        run: |
          npx electron-packager . BonzAI \
            --platform=win32 \
            --arch=x64 \
            --out=out \
            --overwrite \
            --icon=src/assets/logo.ico \
            --ignore="^/(\.local-release-archive|\.chart-data-[^/]*|\.codex-presentation-build|\.codex-finalizer|dist|bonzai|binaries|out|out-test|\.venv|venv|build|\.cache|\.git|test|docs|\.env.*)$|^/src/assets/materials/.*\.jpg$"

      - name: Remove development-only package payload
        run: python scripts/prune-desktop-payload.py "out/BonzAI-win32-x64/resources/app" win32 x64

      - name: Verify packaged native GPU runtime
        run: node scripts/verify-windows-gguf.mjs out/BonzAI-win32-x64/resources/app/bin/windows-x64

      # main.js expects: resources/server/python-runtime/windows-x64/diffuser.exe + _internal/
      - name: Copy Python runtime to app
        shell: bash
        run: |
          APP_RESOURCES="out/BonzAI-win32-x64/resources"
          DEST="$APP_RESOURCES/server/python-runtime/windows-x64"
          mkdir -p "$DEST"
          # onedir: copy executable + _internal/ folder
          cp -r binaries/windows-x64/diffuser/* "$DEST/"
          echo "Python runtime copied:"
          ls -lh "$DEST/diffuser.exe"
          echo "Internal deps: $(ls "$DEST/_internal/" | wc -l) items"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $TAG = "${{ env.TAG }}"
          $ROOT = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "$ROOT\out\make"

          # Pass absolute paths to avoid relative path resolution issues
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="$TAG" `
            /DMySourceDir="$ROOT\out\BonzAI-win32-x64" `
            /DMyOutputDir="$ROOT\out\make" `
            /DMyIconFile="$ROOT\src\assets\logo.ico" `
            /F"BonzAI-$TAG-windows-x64-setup" `
            "$ROOT\installer\windows\setup.iss"

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          Write-Host "Installer created:"
          Get-ChildItem "$ROOT\out\make\" | Format-Table Name, Length

      - name: Test installed application runtimes
        shell: pwsh
        run: |
          $destination = "$env:RUNNER_TEMP\BonzAI-install-check"
          $installer = Get-ChildItem out/make/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw 'Windows installer not found' }
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Test installation failed: $($setup.ExitCode)" }
          try {
            node scripts/verify-windows-gguf.mjs "$destination/resources/app/bin/windows-x64"
            if ($LASTEXITCODE -ne 0) { throw 'Installed GGUF runtime verification failed' }
            & "$destination/resources/server/python-runtime/windows-x64/diffuser.exe" --bonzai-runtime-check
            if ($LASTEXITCODE -ne 0) { throw 'Installed Python runtime verification failed' }
          } finally {
            Remove-Item -Recurse -Force $destination
          }

      - name: Prepare checksummed release assets
        shell: bash
        run: python scripts/release-assets.py prepare out/make

      - name: Configure complete-installer hosting
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        run: python -m pip install awscli

      - name: Upload release assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        run: python scripts/release-assets.py upload out/make --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Mirror to bonzai-releases
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIRROR_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            GH_TOKEN="$MIRROR_TOKEN" python scripts/release-assets.py upload out/make --tag "$RELEASE_TAG" --repo bonzai-depin/bonzai-releases
          fi

      - name: Save validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonzai-${{ env.OS_KEY }}-${{ env.ARCH_KEY }}
          path: out/make/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
