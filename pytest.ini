[pytest]
# The Python security suite uses the repo's *.test.* naming convention
# (test/diffuser-security.test.py), whose hyphen/double-extension is not a
# valid importable module name under pytest's default "prepend" mode.
# importlib mode loads test files by path, so the plain command
#   python3 -m pytest test/diffuser-security.test.py -q
# works without extra flags.
addopts = --import-mode=importlib
testpaths = test
python_files = *.test.py test_*.py *_test.py
